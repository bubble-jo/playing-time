<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f5b81e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>PLAYING TIME · 游戏时光</title>
<style>
  :root {
    --bg: #fdf8ec; --panel: #fffdf6; --panel-2: #f3ecd8;
    --accent: #f5b81e; --accent-2: #5ea9e9;
    --text: #54493a; --text-dim: #a69877;
    --red: #ff8d7a; --green: #7fd6a4; --blue: #8ecfff;
    --purple: #d3b3f7; --yellow: #ffd97a; --black: #4a3b34;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background:
      radial-gradient(700px 340px at 15% 0%, rgba(245,184,30,.18), transparent 60%),
      radial-gradient(700px 340px at 85% 0%, rgba(94,169,233,.16), transparent 60%),
      radial-gradient(600px 300px at 50% 100%, rgba(255,217,122,.2), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "Microsoft YaHei", "微软雅黑", "PingFang SC", sans-serif;
    min-height: 100vh; display: flex; flex-direction: column; align-items: center;
  }
  #app { width: 100%; max-width: 1160px; padding: 24px 20px 60px; }

  .cute-title {
    text-align: center; font-size: 44px; font-weight: 900; letter-spacing: 5px;
    color: var(--accent); margin: 14px 0 2px;
    text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(245,184,30,.4);
  }
  .cute-title span { color: #4a96d9; text-shadow: 0 3px 0 #fff, 0 6px 14px rgba(94,169,233,.4); }
  .site-sub { text-align: center; color: var(--text-dim); margin-bottom: 26px; font-size: 14px; letter-spacing: 3px; }

  .menu-layout { display: flex; gap: 22px; align-items: flex-start; }
  .menu-main { flex: 1; min-width: 0; }
  .game-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  @media (max-width: 960px) { .game-grid { grid-template-columns: repeat(2, 1fr); } .menu-layout { flex-direction: column; } }
  .card {
    background: var(--panel); border: 2px solid var(--panel-2); border-radius: 20px;
    padding: 22px 14px; cursor: pointer; text-align: center; position: relative;
    transition: transform .16s, border-color .16s, box-shadow .16s; user-select: none;
    box-shadow: 0 4px 12px rgba(214,180,140,.18);
  }
  .card:hover {
    transform: translateY(-5px) scale(1.03); border-color: var(--accent);
    box-shadow: 0 10px 24px rgba(245,184,30,.35);
  }
  .card .icon { font-size: 44px; margin-bottom: 10px; }
  .card .name { font-size: 16px; font-weight: bold; }
  .card .desc { font-size: 12px; color: var(--text-dim); margin-top: 6px; line-height: 1.6; }
  .card .lv-tag {
    position: absolute; top: 10px; right: 10px; font-size: 11px; color: #4a96d9;
    background: rgba(94,169,233,.12); border: 1px solid var(--accent-2);
    border-radius: 20px; padding: 2px 8px;
  }

  /* 猫咪面板 */
  .cat-panel {
    width: 300px; flex-shrink: 0; background: var(--panel); border: 2px solid var(--panel-2);
    border-radius: 22px; padding: 18px; text-align: center;
    box-shadow: 0 6px 18px rgba(214,180,140,.25); position: sticky; top: 16px;
  }
  .cat-panel canvas { margin: 6px auto; }
  .cat-panel .hint { margin-top: 10px; }
  .toys-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; min-height: 28px; }
  .toys-row .toy-btn { padding: 6px 10px; font-size: 18px; border-radius: 12px; }
  .theme-row { display: flex; align-items: center; gap: 6px; justify-content: center; margin-top: 14px; }
  .theme-label { font-size: 12px; color: var(--text-dim); }
  .swatch { width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--panel-2); cursor: pointer; padding: 0; }
  .swatch.on { border-color: var(--accent); transform: scale(1.2); }
  .heart-float { position: absolute; font-size: 20px; pointer-events: none; animation: heartUp 1.1s ease-out forwards; }
  @keyframes heartUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-60px); opacity: 0; } }
  .cat-panel h3 { color: #d99a00; font-size: 17px; margin-bottom: 6px; }
  .cat-name { font-size: 15px; font-weight: bold; color: var(--accent); margin: 4px 0 10px; }
  .stat-row { display: flex; align-items: center; gap: 8px; margin: 8px 0; font-size: 13px; }
  .stat-row .label { width: 48px; text-align: right; color: var(--text-dim); }
  .stat-bar { flex: 1; height: 12px; background: var(--panel-2); border-radius: 8px; overflow: hidden; }
  .stat-bar i { display: block; height: 100%; border-radius: 8px; transition: width .4s; }
  .cat-btns { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }
  .cat-btns .btn { padding: 8px 12px; font-size: 13px; }
  .cat-input {
    background: #fff; border: 2px solid var(--panel-2); color: var(--text);
    border-radius: 12px; padding: 10px 14px; font-size: 15px; width: 90%; font-family: inherit;
    margin: 8px 0; text-align: center;
  }
  .cat-input:focus { outline: 2px solid var(--accent-2); }
  .pet-picker { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 10px; }
  .pet-picker .btn { padding: 9px 2px; font-size: 13px; border-radius: 12px; }
  .pet-picker .btn.sel { outline: 2px solid var(--accent); background: rgba(245,184,30,.14); }

  .topbar { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .btn {
    background: var(--panel); color: var(--text); border: 2px solid var(--panel-2);
    border-radius: 14px; padding: 10px 20px; font-size: 15px; cursor: pointer;
    font-family: inherit; transition: filter .12s, transform .1s;
  }
  .btn:hover { filter: brightness(1.05); border-color: var(--accent); }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), #ffd54a); color: #5a4300; font-weight: bold; border: none; box-shadow: 0 4px 12px rgba(245,184,30,.45); }
  .btn.mint { background: linear-gradient(135deg, var(--accent-2), #8ecfff); color: #1d4e79; font-weight: bold; border: none; }
  .btn.big { padding: 14px 34px; font-size: 18px; }
  .btn.sel { outline: 3px solid var(--accent-2); }

  .stage { display: flex; gap: 24px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  canvas { background: var(--panel); border-radius: 16px; display: block; box-shadow: 0 6px 18px rgba(214,180,140,.3); max-width: 100%; height: auto; }
  @media (max-width: 640px) {
    .cute-title { font-size: 30px; letter-spacing: 2px; }
    #app { padding: 12px 8px 50px; }
    .topbar { flex-wrap: wrap; gap: 8px; }
    .game-title { font-size: 19px; }
    .dpad { grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); }
    .side-panel { width: 100%; }
  }
  .side-panel {
    background: var(--panel); border: 2px solid var(--panel-2); border-radius: 18px;
    padding: 18px; min-width: 230px; box-shadow: 0 6px 18px rgba(214,180,140,.25);
  }
  .side-panel h3 { color: var(--accent); margin-bottom: 10px; font-size: 16px; }
  .side-panel .row { margin: 10px 0; font-size: 14px; }
  .hint { color: var(--text-dim); font-size: 13px; text-align: center; margin-top: 14px; }
  .game-title { color: var(--accent); font-size: 24px; text-align: center; margin-bottom: 14px; text-shadow: 0 2px 0 #fff; }

  #modal-mask { position: fixed; inset: 0; background: rgba(90,74,66,.35); display: none; align-items: center; justify-content: center; z-index: 99; backdrop-filter: blur(3px); }
  #modal-mask.show { display: flex; }
  #modal {
    background: var(--panel); border: 3px solid var(--accent); border-radius: 22px;
    padding: 28px 34px; min-width: 320px; max-width: 460px; text-align: center;
    box-shadow: 0 14px 44px rgba(245,184,30,.35); animation: pop .2s ease-out;
  }
  @keyframes pop { from { transform: scale(.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  #modal h2 { color: var(--accent); margin-bottom: 12px; font-size: 22px; }
  #modal .lines { color: var(--text); font-size: 15px; line-height: 1.9; margin-bottom: 20px; word-break: break-all; }
  #modal .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }

  .rps-moves { display: flex; gap: 18px; justify-content: center; margin: 22px 0; }
  .rps-moves .btn { font-size: 20px; padding: 16px 30px; }
  .rps-vs { display: flex; justify-content: center; gap: 60px; font-size: 20px; margin: 14px 0; }
  .rps-result { text-align: center; font-size: 22px; min-height: 34px; font-weight: bold; }
  .rps-stats { text-align: center; color: var(--text-dim); margin-top: 10px; font-size: 15px; }
  .mode-row { display: flex; gap: 10px; justify-content: center; margin: 14px 0; flex-wrap: wrap; }

  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 6px; justify-content: center; margin: 14px 0; }
  .dpad .btn { font-size: 24px; padding: 0; }
  .dpad .empty { visibility: hidden; }

  .num-pad { display: grid; grid-template-columns: repeat(5, 52px); gap: 8px; margin-top: 10px; }
  .num-pad .btn { padding: 10px 0; text-align: center; }

  .guess-input {
    background: #fff; border: 2px solid var(--panel-2); color: var(--text);
    border-radius: 12px; padding: 12px 16px; font-size: 17px; width: 100%; font-family: inherit;
  }
  .guess-input:focus { outline: 2px solid var(--accent-2); }
  .sound-btn { position: fixed; top: 16px; right: 18px; z-index: 50; background: var(--panel); }
  .auth-btn { position: fixed; top: 16px; right: 110px; z-index: 50; background: var(--panel); max-width: 180px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 转盘奖池编辑 */
  .wheel-edit-row { display: flex; gap: 6px; margin: 6px 0; align-items: center; }
  .wheel-edit-row input {
    border: 2px solid var(--panel-2); border-radius: 10px; padding: 7px 10px;
    font-family: inherit; font-size: 13px; color: var(--text); background: #fff;
  }
  .wheel-edit-row input.name-in { flex: 1; min-width: 0; }
  .wheel-edit-row input.w-in { width: 56px; text-align: center; }
  .wheel-edit-row .del { padding: 6px 10px; font-size: 13px; border-radius: 10px; }

  /* 闯关地图 */
  .lv-node { width: 52px; height: 52px; border-radius: 50%; font-size: 17px; font-weight: 900; padding: 0; border: 3px solid #fff; }
  .lv-node.done { background: linear-gradient(135deg, #8adab2, #b6e8cd); color: #2f5a48; }
  .lv-node.cur { background: linear-gradient(135deg, var(--accent), #ffb59e); color: #fff; animation: lvPulse 1.2s infinite; }
  .lv-node.lock { background: #d8cfc4; color: #8f8378; cursor: not-allowed; border-color: #eee8e0; }
  @keyframes lvPulse { 0%,100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,158,170,.55); } 50% { transform: scale(1.14); box-shadow: 0 0 0 9px rgba(255,158,170,0); } }
</style>
</head>
<body>

<button class="btn auth-btn" id="auth-btn">👤 登录</button>
<button class="btn sound-btn" id="sound-btn">🔊 音效开</button>
<div id="app"></div>

<div id="modal-mask">
  <div id="modal">
    <h2 id="modal-title"></h2>
    <div class="lines" id="modal-lines"></div>
    <div class="btns" id="modal-btns"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
// PWA：注册 Service Worker（离线缓存 + 可安装到手机桌面）
if ("serviceWorker" in navigator) { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).catch(() => {}); }
/* ================================================================
   ★★★ 可自定义配置区 ★★★
   ================================================================ */

const SITE_TITLE = "PLAYING TIME";
const SITE_SUB   = "游 戏 时 光 · 离 线 畅 玩";

// 转盘默认奖池（玩家在页面里改过后以页面为准，存浏览器本地）
const WHEEL_CONFIG = [
  { name: "一等奖：键盘钥匙扣", weight: 20 },
  { name: "二等奖：罐头小盆栽", weight: 30 },
  { name: "三等奖：笔",         weight: 50 },
  { name: "参与奖：小卡",       weight: 20 },
];

const SNAKE_LEVELS = 20;   // 贪吃蛇关卡数
const MATCH_LEVELS = 20;   // 消消乐关卡数
const SUDOKU_LEVELS = 20;  // 数独关卡数
const PLANE_BOARD = 10;    // 寻机头棋盘尺寸
const PLANE_COUNT = 3;     // 寻机头飞机数

/* ================================================================
   音效（Web Audio 合成，离线可用）
   ================================================================ */
let actx = null;
let soundOn = localStorage.getItem("pt_sound") !== "off";
function ac() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (actx && actx.state === "suspended") actx.resume();
  return actx;
}
function tone(freq, dur, type = "square", vol = 0.12, slideTo = 0, delay = 0) {
  if (!soundOn) return;
  const a = ac(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, a.currentTime + delay);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, a.currentTime + delay + dur);
    g.gain.setValueAtTime(vol, a.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + delay + dur);
    o.connect(g); g.connect(a.destination);
    o.start(a.currentTime + delay); o.stop(a.currentTime + delay + dur + 0.02);
  } catch (e) {}
}
const SFX = {
  click:  () => tone(650, .06, "square", .10),
  tick:   () => tone(1300, .03, "square", .06),
  jump:   () => tone(280, .18, "square", .12, 720),
  win:    () => { tone(523, .14, "square", .12); tone(659, .14, "square", .12, 0, .13); tone(784, .24, "square", .13, 0, .26); },
  lose:   () => { tone(320, .18, "sawtooth", .10); tone(210, .30, "sawtooth", .10, 0, .16); },
  match:  () => { tone(760, .09, "triangle", .14); tone(1040, .12, "triangle", .14, 0, .08); },
  place:  () => tone(500, .05, "square", .10),
  error:  () => tone(160, .22, "sawtooth", .12),
  reveal: () => tone(880, .12, "triangle", .12, 1320),
  boom:   () => tone(120, .25, "sawtooth", .16, 60),
  eat:    () => tone(880, .08, "sine", .14, 1200),
  meow:   () => { tone(620, .12, "sine", .10, 760); tone(760, .16, "sine", .10, 520, .12); },
  bark:   () => { tone(240, .10, "square", .12, 180); tone(300, .10, "square", .12, 220, .14); },
};
document.getElementById("sound-btn").onclick = function () {
  soundOn = !soundOn;
  localStorage.setItem("pt_sound", soundOn ? "on" : "off");
  this.textContent = soundOn ? "🔊 音效开" : "🔇 音效关";
  if (soundOn) SFX.click();
};
if (!soundOn) document.getElementById("sound-btn").textContent = "🔇 音效关";
window.addEventListener("pointerdown", () => ac(), { once: true });

/* ================================================================
   Supabase：邮箱登录 / 云端存档 / 多人联机
   ================================================================ */
const SUPABASE_URL = "https://oikxqtptkxbuaieljckv.supabase.co";
const SUPABASE_ANON = "sb_publishable_8aQM-AY02vxwjrOoiwoJ8w_v4v6Q4bP";
const sb = (typeof supabase !== "undefined") ? supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
let currentUser = null;
const authBtn = document.getElementById("auth-btn");

function cloudPushProgress() {
  if (!sb || !currentUser) return;
  const p = getProgress();
  sb.from("progress").upsert({
    user_id: currentUser.id,
    snake: p.snake || 1, match: p.match || 1, sudoku: p.sudoku || 1, huarong: p.huarong || 1, digit: p.digit || 1, brain: p.brain || 1,
    updated_at: new Date().toISOString()
  }, { onConflict: "user_id" });
}
async function cloudPullProgress() {
  if (!sb || !currentUser) return;
  const { data } = await sb.from("progress").select("*").eq("user_id", currentUser.id).maybeSingle();
  if (data) {
    // 合并取最大：本地比云端还高的进度不会被覆盖，然后再推回云端
    const p = getProgress();
    const merged = {};
    ["snake", "match", "sudoku", "huarong", "digit", "brain"].forEach(k => {
      merged[k] = Math.max(p[k] || 1, data[k] || 1);
    });
    setProgress(merged);
    cloudPushProgress();
  } else cloudPushProgress();
}
function cloudPushPet() {
  if (!sb || !currentUser) return;
  const c = loadCat(); if (!c) return;
  sb.from("pet").upsert({ user_id: currentUser.id, name: c.name, species: c.species || "cat", hunger: c.hunger, mood: c.mood, clean: c.clean, last_ts: new Date(c.lastTs || Date.now()).toISOString() }, { onConflict: "user_id" });
}
async function cloudPullPet() {
  if (!sb || !currentUser) return;
  const { data } = await sb.from("pet").select("*").eq("user_id", currentUser.id).maybeSingle();
  if (data) {
    // 哪边最后更新时间新就用哪边，避免旧设备覆盖新状态
    const local = loadCat();
    const cloudTs = new Date(data.last_ts).getTime();
    if (!local || cloudTs >= (local.lastTs || 0)) {
      saveCat({ name: data.name, species: data.species || "cat", hunger: data.hunger, mood: data.mood, clean: data.clean, lastTs: cloudTs });
    } else cloudPushPet();
  } else cloudPushPet();
}
function cloudPushToys() {
  if (!sb || !currentUser) return;
  const owned = getUnlockedToys();
  owned.forEach(tid => sb.from("toys").upsert({ user_id: currentUser.id, toy_id: tid }, { onConflict: "user_id,toy_id" }));
}
async function cloudPullToys() {
  if (!sb || !currentUser) return;
  const { data } = await sb.from("toys").select("toy_id").eq("user_id", currentUser.id);
  if (data) {
    // 并集合并：本地有的不丢，云端有的补上
    const set = new Set(getUnlockedToys());
    data.forEach(r => set.add(r.toy_id));
    localStorage.setItem("pt_toys", JSON.stringify([...set]));
    cloudPushToys();
  } else cloudPushToys();
}

/* ---- 个人资料：昵称 + 头像 ---- */
let currentProfile = null;
const AVATARS = ["🐱","🐶","🐰","🦊","🐻","🐼","🐨","🐯","🦁","🐸","🐵","🦄","🐷","🐥","🐳","🦉","🍓","🌸","⭐","🎮"];
async function cloudPullProfile() {
  if (!sb || !currentUser) return null;
  const { data } = await sb.from("profiles").select("*").eq("user_id", currentUser.id).maybeSingle();
  currentProfile = data || null;
  return currentProfile;
}
async function cloudPushProfile(nickname, avatar) {
  if (!sb || !currentUser) return;
  await sb.from("profiles").upsert({ user_id: currentUser.id, nickname, avatar, updated_at: new Date().toISOString() }, { onConflict: "user_id" });
  currentProfile = { nickname, avatar };
  updateAuthBtn();
}
function displayName() {
  return currentProfile ? currentProfile.nickname : (currentUser ? currentUser.email.split("@")[0] : "游客");
}
function authErr(e) {
  const m = (e && e.message) || "";
  if (/Invalid login credentials/i.test(m)) return "邮箱或密码不对（没注册过的话先点「注册」）";
  if (/already been registered|already registered/i.test(m)) return "该邮箱已注册，请直接登录";
  if (/Email not confirmed/i.test(m)) return "邮箱未验证：请到邮箱点确认链接，或让管理员在 Supabase 关闭 Confirm email";
  if (/at least 6|password should/i.test(m)) return "密码至少 6 位";
  if (/valid email|invalid email/i.test(m)) return "邮箱格式不对";
  if (/rate limit|too many/i.test(m)) return "操作太频繁，稍等一会再试";
  return m;
}

function updateAuthBtn() {
  if (currentUser && currentProfile) authBtn.textContent = currentProfile.avatar + " " + currentProfile.nickname;
  else if (currentUser) authBtn.textContent = "👤 设置资料";
  else authBtn.textContent = "👤 登录";
}
authBtn.onclick = () => {
  if (currentUser) {
    const box = document.createElement("div");
    box.style.cssText = "display:flex;align-items:center;gap:14px;justify-content:center;margin-bottom:6px";
    const av = document.createElement("div"); av.style.fontSize = "46px";
    av.textContent = currentProfile ? currentProfile.avatar : "👤";
    const info = document.createElement("div"); info.style.textAlign = "left";
    info.innerHTML = "<div style='font-size:18px;font-weight:bold;color:var(--accent)'>" + (currentProfile ? currentProfile.nickname : "未设置昵称") + "</div>" +
      "<div style='font-size:13px;color:var(--text-dim)'>" + (currentUser.email || "") + "</div>";
    box.appendChild(av); box.appendChild(info);
    showModal("我的账号", [box],
      [{ label: "修改资料", primary: true, onClick: () => { showProfileModal(); return false; } },
       { label: "退出登录", onClick: async () => { await sb.auth.signOut(); currentProfile = null; } },
       { label: "关闭" }]);
  } else {
    showAuthModal();
  }
};

function showProfileModal() {
  const nick = el("input", "guess-input"); nick.placeholder = "起个昵称（大家联机时看到）"; nick.maxLength = 12;
  nick.value = currentProfile ? currentProfile.nickname : "";

/* ================================================================
   多人联机房间系统（你画我猜 / 谁是卧底 共用）
   ================================================================ */
function makeRoom(code) {
  const ch = sb.channel("room:" + code, { config: { presence: { key: currentUser.id } } });
  const room = {
    code, channel: ch, members: [], isHost: false, hostId: null, onMembers: null, joined: false,
    send(evt, payload) { ch.send({ type: "broadcast", event: evt, payload }); },
    on(evt, fn) { ch.on("broadcast", { event: evt }, ({ payload }) => fn(payload)); },
    leave() { try { sb.removeChannel(ch); } catch (e) {} },
    me() { return currentUser ? currentUser.id : ""; },
  };
  ch.on("presence", { event: "sync" }, () => {
    const state = ch.presenceState();
    const list = [];
    Object.keys(state).forEach(uid => {
      const p = state[uid][0];
      if (p) list.push({ uid, name: p.name, avatar: p.avatar, joinTs: p.joinTs });
    });
    list.sort((a, b) => a.joinTs - b.joinTs);
    room.members = list;
    room.hostId = list.length ? list[0].uid : null;
    room.isHost = room.hostId === room.me();
    if (room.onMembers) room.onMembers();
  });
  ch.subscribe(async (status) => {
    if (status === "SUBSCRIBED") {
      await ch.track({ name: displayName(), avatar: currentProfile ? currentProfile.avatar : "👤", joinTs: Date.now() });
      room.joined = true;
      if (room.onJoined) room.onJoined();
    }
  });
  return room;
}

/* ================================================================
   进度存档（每个游戏当前关卡）+ 宠物玩具解锁
   ================================================================ */
function getProgress() {
  try { return JSON.parse(localStorage.getItem("pt_progress")) || {}; } catch (e) { return {}; }
}
function setProgress(patch) {
  const p = getProgress();
  Object.assign(p, patch);
  localStorage.setItem("pt_progress", JSON.stringify(p));
}
function getLevel(gameId, max) {
  const v = getProgress()[gameId] || 1;
  return Math.max(1, Math.min(max, v));
}
function saveLevel(gameId, level) {
  // 只增不减：回玩旧关不会覆盖最高进度
  const cur = getProgress()[gameId] || 1;
  setProgress({ [gameId]: Math.max(level, cur) });
  cloudPushProgress();   // 同步到云端，手机/电脑进度一致
}

  { id: "candy",   emoji: "🍬", name: "彩虹糖",   type: "food", need: { digit: 3 } },
];
const TOY_GAME_NAMES = { snake: "贪吃蛇", match: "消消乐", sudoku: "数独", huarong: "华容道", digit: "数字华容道" };
function nextUnlockHint() {
  const prog = getProgress();
  const owned = getUnlockedToys();
  const ups = TOYS.filter(t => !owned.includes(t.id)).map(t => {
    const [g, lv] = Object.entries(t.need)[0];
    return { t, g, lv, left: lv - (prog[g] || 1) };
  }).filter(x => x.left > 0).sort((a, b) => a.left - b.left).slice(0, 3);
  if (!ups.length) return "🎉 道具全部集齐啦，你太厉害了！";
  return "下一个道具：" + ups.map(x => TOY_GAME_NAMES[x.g] + " " + x.lv + " 关→" + x.t.emoji + x.t.name).join("；");
}
function getUnlockedToys() {
  try { return JSON.parse(localStorage.getItem("pt_toys")) || []; } catch (e) { return []; }
}
function checkToyUnlocks() {
  const prog = getProgress();
  const owned = getUnlockedToys();
  const newly = [];
  for (const toy of TOYS) {
    if (owned.includes(toy.id)) continue;
    const [g, lv] = Object.entries(toy.need)[0];
    if ((prog[g] || 1) >= lv) { owned.push(toy.id); newly.push(toy); }
  }
  if (newly.length) { localStorage.setItem("pt_toys", JSON.stringify(owned)); cloudPushToys(); }
  return newly;
}

function openLevelMap(cfg) {
  const game = typeof cfg.game === "function" ? cfg.game() : cfg.game;

  const grid = el("div"); grid.style.cssText = "display:flex;flex-wrap:wrap;gap:16px 20px;justify-content:center;margin:18px 0 8px";
  for (let i = 1; i <= total; i++) {
    const st = i < unlocked ? "done" : (i === unlocked ? "cur" : "lock");
    const b = el("button", "btn lv-node " + st, st === "lock" ? "🔒" : String(i));
    if (st === "done") b.title = "第 " + i + " 关 · 已通过，点我回玩";

function buildCatPanel() {

  let cat = loadCat();

  if (cat) {
    // 离线期间状态衰减（按小时折算，最多扣 40）
    const awayH = Math.min(8, (Date.now() - (cat.lastTs || Date.now())) / 3600000);
    if (awayH > 0.1) {
      const drop = Math.floor(awayH * 5);
      cat.hunger = Math.max(5, cat.hunger - drop);
      cat.mood   = Math.max(5, cat.mood - drop);
      cat.clean  = Math.max(5, cat.clean - drop);
    }
  }

  if (!cat) {
    panel.appendChild(el("h3", null, "🐾 领养一只小伙伴"));
    panel.appendChild(cv);
    let selType = PET_TYPES[0];
    const picker = el("div", "pet-picker");
    const nameIn = el("input", "cat-input");
    const typeBtns = [];
    PET_TYPES.forEach(pt => {
      const b = el("button", "btn", pt.emoji + " " + pt.label);
      b.onclick = () => {
        selType = pt;
        typeBtns.forEach(x => x.classList.remove("sel"));
        b.classList.add("sel");
        nameIn.placeholder = "给它取个名字（默认 " + pt.defaultName + "）";
        SFX.click();
      };
      typeBtns.push(b);
      picker.appendChild(b);
    });
    typeBtns[0].classList.add("sel");
    panel.appendChild(picker);
    nameIn.placeholder = "给它取个名字（默认 " + selType.defaultName + "）";
    nameIn.maxLength = 8;
    panel.appendChild(nameIn);
    const adoptBtn = el("button", "btn primary", "确认领养");
    adoptBtn.style.width = "100%"; adoptBtn.style.marginTop = "4px";
    adoptBtn.onclick = () => {
      const name = nameIn.value.trim() || selType.defaultName;
      saveCat({ name, species: selType.id, hunger: 90, mood: 90, clean: 90, lastTs: Date.now() });
      petSound({ species: selType.id });
      show(menuView);
    };
    panel.appendChild(adoptBtn);
    panel.appendChild(el("div", "hint", "它会陪你一起打游戏哦"));
    drawCatLoop(cv, () => ({ mood: 80, species: selType.id }));
    return panel;
  }

  const myType = petType(cat.species);
  panel.appendChild(el("h3", null, "🐾 我的小伙伴"));
  panel.appendChild(cv);
  panel.appendChild(el("div", "cat-name", myType.emoji + " " + cat.name + " · " + myType.label));

  const stats = [["饱腹", "hunger", "#ff9f43"], ["心情", "mood", "#ffd97a"], ["清洁", "clean", "#5ea9e9"]];
  const bars = {};
  stats.forEach(([label, key, color]) => {
    const row = el("div", "stat-row");
    row.appendChild(el("div", "label", label));
    const bar = el("div", "stat-bar");
    const fill = document.createElement("i");
    fill.style.background = color;
    bar.appendChild(fill);
    row.appendChild(bar);
    panel.appendChild(row);
    bars[key] = fill;
  });
  function updBars() {
    bars.hunger.style.width = cat.hunger + "%";
    bars.mood.style.width = cat.mood + "%";
    bars.clean.style.width = cat.clean + "%";
  }
  updBars();

  const btns = el("div", "cat-btns");
  const acts = [["🍖 喂食", "hunger"], ["🧶 玩耍", "mood"], ["🛁 洗澡", "clean"], ["🤚 摸摸", "pet"]];
  acts.forEach(([label, key]) => {
    const b = el("button", key === "pet" ? "btn mint" : "btn mint", label);
    b.onclick = () => {
      if (key === "pet") { cat.mood = Math.min(100, cat.mood + 8); floatHeart(panel); }
      else cat[key] = Math.min(100, cat[key] + 18);
      cat.lastTs = Date.now();
      saveCat(cat); updBars(); petSound(cat);
    };
    btns.appendChild(b);
  });
  panel.appendChild(btns);

  // 道具栏（闯关解锁的食物和玩具，点一下互动）
  let playEmoji = null, playUntil = 0;
  panel.appendChild(el("div", "hint", "🎁 我的道具（点一下和它互动）"));
  const toysDiv = el("div", "toys-row");
  const owned = getUnlockedToys();
  if (owned.length === 0) {
    toysDiv.appendChild(el("div", "hint", "还没有道具，去闯关赢一个吧！"));
  } else {
    owned.forEach(tid => {
      const toy = TOYS.find(t => t.id === tid);
      if (!toy) return;
      const b = el("button", "btn toy-btn", toy.emoji);
      b.title = toy.type === "food" ? toy.name + " · 喂它吃（饱腹+15）" : toy.name + " · 给它玩（心情+15）";

        if (toy.type === "food") { cat.hunger = Math.min(100, cat.hunger + 15); SFX.eat(); }
        else { cat.mood = Math.min(100, cat.mood + 15); SFX.win(); }
        playEmoji = toy.emoji; playUntil = performance.now() + 4000;
        cat.lastTs = Date.now();
        saveCat(cat); updBars(); floatHeart(panel);
      };
      toysDiv.appendChild(b);
    });
  }
  panel.appendChild(toysDiv);
  panel.appendChild(el("div", "hint", nextUnlockHint()));

  // 主题颜色选择
  const themeDiv = el("div", "theme-row");
  themeDiv.appendChild(el("div", "theme-label", "🎨 主题"));
  THEMES.forEach(t => {
    const s = el("button", "swatch");
    s.style.background = t.swatch; s.title = t.name;
    if ((localStorage.getItem("pt_theme") || "yellow") === t.id) s.classList.add("on");
    s.onclick = () => {
      applyTheme(t.id);
      [...themeDiv.children].forEach(c => c.classList.remove("on"));
      s.classList.add("on");
      SFX.click();
    };
    themeDiv.appendChild(s);
  });
  panel.appendChild(themeDiv);

  panel.appendChild(el("div", "hint", "状态会慢慢下降，记得常来看看它"));

  // 定时衰减 + 存档
  catTimer = setInterval(() => {
    cat.hunger = Math.max(5, cat.hunger - 1);
    cat.mood   = Math.max(5, cat.mood - 1);
    cat.clean  = Math.max(5, cat.clean - 1);
    cat.lastTs = Date.now();
    saveCat(cat); updBars();
  }, 30000);

  drawCatLoop(cv, () => {
    if (playEmoji && performance.now() > playUntil) playEmoji = null;
    return Object.assign({}, cat, { playEmoji });
  });
  return panel;
}

function floatHeart(parent) {
  const h = document.createElement("div");
  h.className = "heart-float"; h.textContent = "💖";
  const rect = parent.getBoundingClientRect();
  h.style.left = (rect.width / 2 - 12) + "px";
  h.style.top = "40px";
  parent.style.position = "relative";
  parent.appendChild(h);
  setTimeout(() => h.remove(), 1100);
}

function drawCatLoop(cv, getCat) {
  const ctx = cv.getContext("2d");
  const t0 = performance.now();
  function frame(t) {
    const cat = getCat();
    const avg = cat ? (cat.hunger ?? 80) * 0.4 + (cat.mood ?? 80) * 0.4 + (cat.clean ?? 80) * 0.2 : 80;
    const mood = avg > 55 ? "happy" : (avg > 30 ? "normal" : "sad");
    drawPet(ctx, (t - t0) / 1000, mood, petType(cat && cat.species), cat && cat.playEmoji);
    catRaf = requestAnimationFrame(frame);
  }
  catRaf = requestAnimationFrame(frame);
}

function drawPet(ctx, t, mood, pt, pe) {
  ctx.clearRect(0, 0, 180, 170);
  // 草地背景
  ctx.fillStyle = "#eef7e4";
  ctx.beginPath(); ctx.roundRect(0, 0, 180, 170, 16); ctx.fill();
  ctx.fillStyle = "#dcefcd";
  ctx.beginPath(); ctx.ellipse(90, 150, 70, 16, 0, 0, Math.PI * 2); ctx.fill();
  // 小花
  [[30, 140], [150, 138]].forEach(([x, y]) => {
    ctx.fillStyle = "#8ecfff";
    for (let i = 0; i < 5; i++) {
      const a = i / 5 * Math.PI * 2;
      ctx.beginPath(); ctx.arc(x + Math.cos(a) * 5, y + Math.sin(a) * 5, 3, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = "#ffd97a";
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  });

  const blink = (t % 3.2) < 0.12;
  const tailWag = Math.sin(t * 2.2) * 0.25;
  const cx = 90, cy = 108;

  // 尾巴
  if (pt.tail === "puff") {
    ctx.fillStyle = pt.tailC;
    ctx.beginPath(); ctx.arc(cx + 38, cy + 16, 10, 0, Math.PI * 2); ctx.fill();
  } else if (pt.tail === "curl") {
    ctx.strokeStyle = pt.tailC; ctx.lineWidth = 9; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx + 40, cy + 4, 13, Math.PI * 0.4, Math.PI * 1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + 40, cy + 4, 5, Math.PI * 0.8, Math.PI * 2.1); ctx.stroke();
  } else {
    ctx.strokeStyle = pt.tailC; ctx.lineWidth = pt.tail === "dog" ? 12 : 9; ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(cx + 32, cy + 20);
    ctx.quadraticCurveTo(cx + 56, cy + 12, cx + 58 + tailWag * 20, cy - 14 + tailWag * 10);
    ctx.stroke();
  }
  // 身体
  ctx.fillStyle = pt.body;
  ctx.beginPath(); ctx.ellipse(cx, cy + 18, 34, 24, 0, 0, Math.PI * 2); ctx.fill();
  // 头
  ctx.beginPath(); ctx.arc(cx, cy - 16, 30, 0, Math.PI * 2); ctx.fill();
  // 奶牛猫黑斑
  if (pt.patch) {
    ctx.fillStyle = "#4a3b34";
    ctx.beginPath(); ctx.arc(cx - 14, cy - 38, 12, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + 20, cy + 12, 9, 0, Math.PI * 2); ctx.fill();
  }
  // 耳朵
  if (pt.ear === "long") {
    [[-1], [1]].forEach(([s]) => {
      ctx.fillStyle = pt.body;
      ctx.beginPath(); ctx.ellipse(cx + s * 15, cy - 56, 8, 22, s * 0.15, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = pt.inner;
      ctx.beginPath(); ctx.ellipse(cx + s * 15, cy - 54, 4, 14, s * 0.15, 0, Math.PI * 2); ctx.fill();
    });
  } else if (pt.ear === "floppy") {
    [[-1], [1]].forEach(([s]) => {
      ctx.fillStyle = pt.inner;
      ctx.beginPath(); ctx.ellipse(cx + s * 28, cy - 26, 9, 17, s * 0.45, 0, Math.PI * 2); ctx.fill();
    });
  } else {
    [[-1, 0], [1, 0]].forEach(([s]) => {
      ctx.fillStyle = pt.body;
      ctx.beginPath();
      ctx.moveTo(cx + s * 26, cy - 30); ctx.lineTo(cx + s * 12, cy - 52); ctx.lineTo(cx + s * 4, cy - 34);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = pt.inner;
      ctx.beginPath();
      ctx.moveTo(cx + s * 21, cy - 33); ctx.lineTo(cx + s * 13, cy - 46); ctx.lineTo(cx + s * 8, cy - 35);
      ctx.closePath(); ctx.fill();
    });
  }
  // 眼睛
  ctx.fillStyle = "#4a3b34";
  if (blink) {
    ctx.strokeStyle = "#4a3b34"; ctx.lineWidth = 2.5;
    [[-12], [12]].forEach(([dx]) => {
      ctx.beginPath(); ctx.moveTo(cx + dx - 5, cy - 18); ctx.quadraticCurveTo(cx + dx, cy - 15, cx + dx + 5, cy - 18); ctx.stroke();
    });
  } else {
    [[-12], [12]].forEach(([dx]) => {
      ctx.beginPath(); ctx.arc(cx + dx, cy - 18, 4, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = "#fff";
    [[-13], [11]].forEach(([dx]) => {
      ctx.beginPath(); ctx.arc(cx + dx, cy - 19.5, 1.6, 0, Math.PI * 2); ctx.fill();
    });
  }
  // 腮红
  ctx.fillStyle = "rgba(255,158,120,.45)";
  [[-22], [22]].forEach(([dx]) => {
    ctx.beginPath(); ctx.ellipse(cx + dx, cy - 6, 5, 3, 0, 0, Math.PI * 2); ctx.fill();
  });
  // 鼻子 + 嘴（随心情）
  ctx.fillStyle = pt.nose;
  ctx.beginPath(); ctx.arc(cx, cy - 8, 2.6, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = "#4a3b34"; ctx.lineWidth = 2;
  ctx.beginPath();
  if (mood === "happy") {
    ctx.moveTo(cx - 6, cy - 4); ctx.quadraticCurveTo(cx - 3, cy - 1, cx, cy - 4);
    ctx.quadraticCurveTo(cx + 3, cy - 1, cx + 6, cy - 4);
  } else if (mood === "normal") {
    ctx.moveTo(cx - 5, cy - 3); ctx.lineTo(cx + 5, cy - 3);
  } else {
    ctx.moveTo(cx - 5, cy - 1); ctx.quadraticCurveTo(cx, cy - 6, cx + 5, cy - 1);
  }
  ctx.stroke();
  // 狗狗开心吐舌头
  if (mood === "happy" && pt.sound === "bark") {
    ctx.fillStyle = "#ff9e9e";
    ctx.beginPath(); ctx.roundRect(cx - 3, cy - 2, 6, 9, 3); ctx.fill();
  }
  // 胡须
  ctx.strokeStyle = "rgba(90,74,66,.5)"; ctx.lineWidth = 1.5;
  [[-1, -4], [-1, 1], [1, -4], [1, 1]].forEach(([s, dy]) => {
    ctx.beginPath();
    ctx.moveTo(cx + s * 26, cy - 10 + dy);
    ctx.lineTo(cx + s * 42, cy - 12 + dy * 2);
    ctx.stroke();
  });
  // 正在玩的道具 / 正在吃的食物（弹跳动画）
  if (pe) {
    const by = cy + 42 + Math.sin(t * 6) * 8;
    ctx.font = "26px serif"; ctx.textAlign = "center";
    ctx.fillText(pe, cx + 54, by);
  }
}

function loadWheelConfig() {
  try {
    const c = JSON.parse(localStorage.getItem("pt_wheel"));
    if (Array.isArray(c) && c.length >= 2 && c.every(p => p.name && p.weight > 0)) return c;
  } catch (e) {}
  return WHEEL_CONFIG.map(p => ({ ...p }));
}

function wheelView(root) {
  root.appendChild(backBar("🎡 幸运转盘"));
  const stage = el("div", "stage");
  const cv = makeCanvas(520, 520);
  stage.appendChild(cv);

  const side = el("div", "side-panel");
  side.style.width = "300px";
  const sideTitle = el("h3", null, "奖池（权重自动占比）");
  side.appendChild(sideTitle);
  const listBox = el("div");
  side.appendChild(listBox);
  const spinBtn = el("button", "btn primary big", "开始转动");
  spinBtn.style.width = "100%"; spinBtn.style.marginTop = "14px";
  side.appendChild(spinBtn);
  const editBtn = el("button", "btn mint", "⚙ 编辑奖池");
  editBtn.style.cssText = "width:100%;margin-top:8px";
  side.appendChild(editBtn);
  stage.appendChild(side);
  root.appendChild(stage);
  root.appendChild(el("div", "hint", "点「编辑奖池」可以修改 / 添加 / 删除奖品和权重 · ESC 返回"));

  const ctx = cv.getContext("2d");
  const cx = 260, cy = 260, R = 230;
  const colors = ["#f5b81e", "#ffd97a", "#8adab2", "#8ecfff", "#d3b3f7", "#ffb59e", "#a8e6c8", "#ff8d7a"];
  let prizes = loadWheelConfig();
  let sectors = [], rot = 0, spinning = false, editing = false;

  function rebuild() {
    const totalW = prizes.reduce((s, p) => s + p.weight, 0) || 1;
    sectors = []; let acc = 0;
    prizes.forEach((p, i) => {
      const span = p.weight / totalW * 360;
      sectors.push({ name: p.name, start: acc, end: acc + span, color: colors[i % colors.length] });
      acc += span;
    });
  }
  function renderSide() {
    listBox.innerHTML = "";
    if (!editing) {
      sideTitle.textContent = "奖池（权重自动占比）";
      const totalW = prizes.reduce((s, p) => s + p.weight, 0) || 1;
      prizes.forEach((p, i) => {
        const r = el("div", "row");
        r.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:' +
          colors[i % colors.length] + ';margin-right:8px"></span>' +
          p.name + '　<b style="color:var(--text-dim)">' + (p.weight / totalW * 100).toFixed(1) + "%</b>";
        listBox.appendChild(r);
      });
      spinBtn.style.display = "";
      editBtn.textContent = "⚙ 编辑奖池";
    } else {
      sideTitle.textContent = "编辑奖池";
      prizes.forEach((p, i) => {
        const row = el("div", "wheel-edit-row");
        const nameIn = document.createElement("input");
        nameIn.className = "name-in"; nameIn.value = p.name; nameIn.maxLength = 20;
        nameIn.oninput = () => { p.name = nameIn.value; };
        const wIn = document.createElement("input");
        wIn.className = "w-in"; wIn.type = "number"; wIn.min = "1"; wIn.max = "999"; wIn.value = p.weight;
        wIn.oninput = () => { p.weight = Math.max(1, Number(wIn.value) || 1); };
        const del = el("button", "btn del", "✕");
        del.onclick = () => {
          if (prizes.length <= 2) { SFX.error(); return; }
          SFX.click(); prizes.splice(i, 1); rebuild(); draw(); renderSide();
        };
        row.appendChild(nameIn); row.appendChild(wIn); row.appendChild(del);
        listBox.appendChild(row);
      });
      const addBtn = el("button", "btn", "＋ 添加奖品");
      addBtn.style.cssText = "width:100%;margin-top:6px";
      addBtn.onclick = () => {
        if (prizes.length >= 8) { SFX.error(); return; }
        SFX.click(); prizes.push({ name: "新奖品", weight: 20 }); rebuild(); draw(); renderSide();
      };
      listBox.appendChild(addBtn);
      spinBtn.style.display = "none";
      editBtn.textContent = "✔ 保存";
    }
  }
  editBtn.onclick = () => {
    editing = !editing;
    SFX.click();
    if (!editing) {
      prizes = prizes.filter(p => p.name.trim());
      if (prizes.length < 2) prizes = loadWheelConfig();
      localStorage.setItem("pt_wheel", JSON.stringify(prizes));
      rebuild(); draw();
    }
    renderSide();
  };

  function draw() {
    ctx.clearRect(0, 0, 520, 520);
    sectors.forEach(s => {
      const a0 = (s.start + rot) * Math.PI / 180, a1 = (s.end + rot) * Math.PI / 180;
      ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, R, a0, a1); ctx.closePath();
      ctx.fillStyle = s.color; ctx.fill();
      ctx.strokeStyle = "#fffaf2"; ctx.lineWidth = 3; ctx.stroke();
      let short = s.name.split(/[：:]/).pop();
      if (short.length > 6) short = short.slice(0, 6) + "..";
      const mid = (a0 + a1) / 2;
      ctx.save();
      ctx.translate(cx + R * 0.62 * Math.cos(mid), cy + R * 0.62 * Math.sin(mid));
      let tr = ((mid + Math.PI) % Math.PI) - Math.PI / 2;
      ctx.rotate(tr);
      ctx.fillStyle = "#4a3b34"; ctx.font = "bold 15px Microsoft YaHei";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(short, 0, 0);
      ctx.restore();
    });
    ctx.beginPath(); ctx.arc(cx, cy, 46, 0, Math.PI * 2);
    ctx.fillStyle = "#fffaf2"; ctx.fill();
    ctx.strokeStyle = "#f5b81e"; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = "#d99a00"; ctx.font = "bold 18px Microsoft YaHei";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("抽奖", cx, cy);
    ctx.beginPath();
    ctx.moveTo(cx - 18, cy - R - 4); ctx.lineTo(cx + 18, cy - R - 4); ctx.lineTo(cx, cy - R + 30);
    ctx.closePath(); ctx.fillStyle = "#ff8d7a"; ctx.fill();
  }
  function sectorAt(angle) {
    const p = ((angle % 360) + 360) % 360;
    return sectors.findIndex(s => p >= s.start && p < s.end);
  }
  spinBtn.onclick = () => {
    if (spinning || editing) return;
    SFX.click();
    spinning = true; spinBtn.disabled = true;
    const target = rot + 360 * rndi(4, 6) + rnd(0, 360);
    const start = rot, dur = 4600, t0 = performance.now();
    let lastSec = sectorAt(270 - rot);
    function frame(t) {
      const k = Math.min(1, (t - t0) / dur);
      const e = 1 - Math.pow(1 - k, 4);
      rot = start + (target - start) * e;
      const nowSec = sectorAt(270 - rot);
      if (nowSec !== lastSec) { lastSec = nowSec; SFX.tick(); }
      draw();
      if (k < 1) requestAnimationFrame(frame);
      else {
        spinning = false; spinBtn.disabled = false;
        const hit = sectors[sectorAt(270 - rot)] || sectors[0];
        SFX.win();
        showModal("🎉 恭喜！", ["你抽到了：<b style='color:var(--accent)'>" + hit.name + "</b>"],
          [{ label: "确定", primary: true }]);
      }
    }
    requestAnimationFrame(frame);
  };
  rebuild(); draw(); renderSide();
  return onEsc();
}

/* ================================================================
   2. 恐龙跑酷（最高分持久化）
   ================================================================ */
function dinoView(root) {
  root.appendChild(backBar("🦖 恐龙跑酷"));
  const cv = makeCanvas(920, 320);
  cv.style.margin = "0 auto";
  const wrap = el("div"); wrap.style.textAlign = "center"; wrap.appendChild(cv);
  root.appendChild(wrap);
  root.appendChild(el("div", "hint", "空格 / 点击跳跃 · 最高纪录自动保存 · ESC 返回"));

  const ctx = cv.getContext("2d");
  const GROUND = 270;
  let dino, obstacles, score, over, raf = null, started;
  let best = Number(localStorage.getItem("pt_dino_best") || 0);

  function reset() {
    dino = { x: 70, y: GROUND - 44, w: 40, h: 44, vy: 0, onGround: true };
    obstacles = []; score = 0; over = false; started = false;
  }
  reset();
  function jump() {
    if (over) return;
    started = true;
    if (dino.onGround) { dino.vy = -13; dino.onGround = false; SFX.jump(); }
  }
  function loop() {
    if (started && !over) {
      const speed = Math.min(13, 6 + score * 0.012);
      dino.vy += 0.65; dino.y += dino.vy;
      if (dino.y >= GROUND - dino.h) { dino.y = GROUND - dino.h; dino.vy = 0; dino.onGround = true; }
      if (obstacles.length === 0 || obstacles[obstacles.length - 1].x < 920 - rnd(280, 560)) {
        const h = rndi(30, 62), w = rndi(18, 34);
        obstacles.push({ x: 940, y: GROUND - h, w, h });
      }
      obstacles.forEach(o => o.x -= speed);
      obstacles = obstacles.filter(o => o.x + o.w > -10);
      score += 0.12;
      for (const o of obstacles) {
        if (dino.x + 6 < o.x + o.w && dino.x + dino.w - 6 > o.x &&
            dino.y + 4 < o.y + o.h && dino.y + dino.h > o.y) {
          over = true; SFX.boom();
          const sc = Math.floor(score);
          if (sc > best) { best = sc; localStorage.setItem("pt_dino_best", best); }
          setTimeout(() => { SFX.lose(); showModal("💥 游戏结束",
            ["本次得分：<b style='color:var(--accent)'>" + sc + "</b>", "历史最高：" + best],
            [{ label: "重新开始", primary: true, onClick: reset },
             { label: "返回主菜单", onClick: () => show(menuView) }]); }, 350);
          break;
        }
      }
    }
    ctx.clearRect(0, 0, 920, 320);
    ctx.fillStyle = "#fdf3e7"; ctx.fillRect(0, 0, 920, 320);
    // 云朵
    ctx.fillStyle = "rgba(255,255,255,.8)";
    [[200, 60], [520, 90], [780, 50]].forEach(([x, y]) => {
      ctx.beginPath(); ctx.ellipse(x, y, 30, 14, 0, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.ellipse(x + 24, y + 5, 22, 11, 0, 0, Math.PI * 2); ctx.fill();
    });
    ctx.strokeStyle = "#c9a684"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, GROUND); ctx.lineTo(920, GROUND); ctx.stroke();
    ctx.fillStyle = over ? "#ff8d9d" : "#7fd6a4";
    ctx.fillRect(dino.x, dino.y, dino.w, dino.h);
    ctx.fillStyle = "#4a3b34";
    ctx.fillRect(dino.x + 26, dino.y + 8, 7, 7);
    ctx.fillRect(dino.x + 30, dino.y + 26, 10, 4);
    ctx.fillStyle = "#8adab2";
    obstacles.forEach(o => {
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillRect(o.x - 6, o.y + 10, 6, 14);
      ctx.fillRect(o.x + o.w, o.y + 16, 6, 14);
    });
    ctx.fillStyle = "#5a4a42"; ctx.font = "bold 20px Microsoft YaHei";
    ctx.textAlign = "right"; ctx.fillText("分数 " + Math.floor(score), 900, 34);
    ctx.fillStyle = "#a39084"; ctx.font = "15px Microsoft YaHei";
    ctx.fillText("最高 " + best, 900, 58);
    if (!started && !over) {
      ctx.fillStyle = "#d99a00"; ctx.font = "bold 22px Microsoft YaHei";
      ctx.textAlign = "center"; ctx.fillText("按 空格 或 点击画面 开始", 460, 130);
    }
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
  const keyH = (e) => {
    if (e.code === "Space" || e.code === "ArrowUp") { e.preventDefault(); jump(); }
    if (e.key === "Escape") show(menuView);
  };
  const clickH = () => jump();
  window.addEventListener("keydown", keyH);
  cv.addEventListener("mousedown", clickH);
  return () => { cancelAnimationFrame(raf); window.removeEventListener("keydown", keyH); cv.removeEventListener("mousedown", clickH); };
}

/* ================================================================
   4. 五子棋 AI 对战
   ================================================================ */
function gomokuView(root) {
  root.appendChild(backBar("⚫ 五子棋"));
  const N = 15, CELL = 40, PAD = 24, SIZE = PAD * 2 + CELL * (N - 1);
  const cv = makeCanvas(SIZE, SIZE);
  cv.style.margin = "0 auto";
  const wrap = el("div"); wrap.style.textAlign = "center"; wrap.appendChild(cv);
  root.appendChild(wrap);
  const status = el("div", "hint", "你的回合（黑棋）· 点击交叉点落子 · ESC 返回");
  root.appendChild(status);
  const ctx = cv.getContext("2d");

  let board, gameOver, thinking;
  function reset() { board = Array.from({ length: N }, () => Array(N).fill(0)); gameOver = false; thinking = false; draw(); }
  const inB = (r, c) => r >= 0 && r < N && c >= 0 && c < N;
  function countDir(r, c, dr, dc, v) {
    let n = 0;
    for (let i = 1; i < 5; i++) {
      const nr = r + dr * i, nc = c + dc * i;
      if (!inB(nr, nc) || board[nr][nc] !== v) break;
      n++;
    }
    return n;
  }
  function checkWin(r, c, v) {
    return [[1,0],[0,1],[1,1],[1,-1]].some(([dr,dc]) => countDir(r,c,dr,dc,v) + countDir(r,c,-dr,-dc,v) >= 4);
  }
  function aiMove() {
    let bestS = -1, best = null;
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (board[r][c]) continue;
      const atk = [[1,0],[0,1],[1,1],[1,-1]].reduce((s,[dr,dc]) => Math.max(s, countDir(r,c,dr,dc,2) + countDir(r,c,-dr,-dc,2)), 0);
      const def = [[1,0],[0,1],[1,1],[1,-1]].reduce((s,[dr,dc]) => Math.max(s, countDir(r,c,dr,dc,1) + countDir(r,c,-dr,-dc,1)), 0);
      const center = 7 - Math.max(Math.abs(r - 7), Math.abs(c - 7));
      const sc = Math.pow(10, atk) + Math.pow(10, def) * 0.9 + center * 0.01 + Math.random() * 0.001;
      if (sc > bestS) { bestS = sc; best = [r, c]; }
    }
    return best;
  }
  function draw() {
    ctx.fillStyle = "#f0cd8f"; ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.strokeStyle = "#8a6a3f"; ctx.lineWidth = 1;
    for (let i = 0; i < N; i++) {
      ctx.beginPath(); ctx.moveTo(PAD + i * CELL, PAD); ctx.lineTo(PAD + i * CELL, SIZE - PAD); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(PAD, PAD + i * CELL); ctx.lineTo(SIZE - PAD, PAD + i * CELL); ctx.stroke();
    }
    [[3,3],[3,11],[11,3],[11,11],[7,7]].forEach(([r,c]) => {
      ctx.beginPath(); ctx.arc(PAD + c * CELL, PAD + r * CELL, 4, 0, Math.PI * 2);
      ctx.fillStyle = "#8a6a3f"; ctx.fill();
    });
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (!board[r][c]) continue;
      const x = PAD + c * CELL, y = PAD + r * CELL;
      ctx.beginPath(); ctx.arc(x, y, CELL * 0.42, 0, Math.PI * 2);
      if (board[r][c] === 1) { ctx.fillStyle = "#3a3230"; ctx.fill(); }
      else { ctx.fillStyle = "#fffdf7"; ctx.fill(); ctx.strokeStyle = "#b8a58f"; ctx.stroke(); }
    }
  }
  cv.addEventListener("mousedown", (e) => {
    if (gameOver || thinking) return;
    const [px, py] = evXY(e, cv);
    const c = Math.round((px - PAD) / CELL);
    const r = Math.round((py - PAD) / CELL);
    if (!inB(r, c) || board[r][c]) return;
    board[r][c] = 1; SFX.place(); draw();
    if (checkWin(r, c, 1)) {
      gameOver = true; SFX.win();
      showModal("🎉 恭喜获胜！", ["你赢了！"],
        [{ label: "重新开局", primary: true, onClick: reset },
         { label: "返回主菜单", onClick: () => show(menuView) }]);
      return;
    }
    thinking = true; status.textContent = "AI 思考中...";
    setTimeout(() => {
      const [ar, ac] = aiMove();
      board[ar][ac] = 2; SFX.place(); draw(); thinking = false;
      if (checkWin(ar, ac, 2)) {
        gameOver = true; SFX.lose();
        showModal("😢 很遗憾", ["AI 获胜！"],
          [{ label: "重新开局", primary: true, onClick: reset },
           { label: "返回主菜单", onClick: () => show(menuView) }]);
      } else status.textContent = "你的回合（黑棋）";
    }, 250);
  });
  reset();
  return onEsc();
}

const GUESS_ALL = GUESS_WORDS.map(x => x.w).concat(GUESS_EXTRA.filter((w, i, a) => a.indexOf(w) === i));

function guessView(root) {
  root.appendChild(backBar("🎨 你画我猜"));
  const stage = el("div", "stage");
  const cv = makeCanvas(400, 400);
  cv.style.background = "#fffdf7"; cv.style.touchAction = "none"; cv.style.margin = "0 auto";
  stage.appendChild(cv);
  const side = el("div", "side-panel");
  side.appendChild(el("h3", null, "🎨 你画我猜"));
  const statEl = el("div", "row"); statEl.style.cssText = "font-weight:bold;color:var(--accent)";
  side.appendChild(statEl);
  // 作画工具（仅作画者可见）
  const tools = el("div"); tools.style.cssText = "display:none;margin:8px 0";
  const DCOLORS = ["#4a3b34", "#ff8d9d", "#f5b81e", "#7fd6a4", "#5ea9e9", "#a98ee6", "#8a5a3a"];
  let brushColor = DCOLORS[0], brushW = 5, erasing = false;
  const colorBtns = [];
  const eraserBtn = el("button", "btn", "🧽"); eraserBtn.title = "橡皮擦"; eraserBtn.style.cssText = "padding:2px 7px;font-size:15px;margin:2px";
  function markBrush() {
    colorBtns.forEach(x => { x.b.style.outline = (x.c === brushColor && !erasing) ? "3px solid var(--accent)" : "none"; });
    eraserBtn.style.outline = erasing ? "3px solid var(--accent)" : "none";
  }
  DCOLORS.forEach(c => {
    const b = el("button", "btn");
    b.style.cssText = "width:26px;height:26px;border-radius:50%;padding:0;background:" + c + ";margin:2px";
    b.onclick = () => { brushColor = c; erasing = false; markBrush(); SFX.click(); };
    colorBtns.push({ b, c });
    tools.appendChild(b);
  });
  eraserBtn.onclick = () => { erasing = true; markBrush(); SFX.click(); };
  tools.appendChild(eraserBtn);
  const clearBtn = el("button", "btn", "🗑 清空"); clearBtn.style.cssText = "padding:4px 10px;font-size:13px;margin:2px";
  tools.appendChild(clearBtn);
  side.appendChild(tools);
  stage.appendChild(side);
  root.appendChild(stage);
  stage.style.display = "none";

  const ctx = cv.getContext("2d");
  ctx.lineCap = "round"; ctx.lineJoin = "round";

  let mode = null;           // "single" | "room"
  let item = null, step = 0, timer = null, over = false;
  let lobby = null, room = null, chat = null;
  let drawerUid = null, curWord = "", usedIdx = new Set();

  function execOp(op) {
    const [t, ...a] = op;
    if (t === "c") { ctx.beginPath(); ctx.arc(a[0], a[1], a[2], 0, Math.PI * 2); ctx.fillStyle = a[3]; ctx.fill(); }
    else if (t === "e") { ctx.beginPath(); ctx.ellipse(a[0], a[1], a[2], a[3], 0, 0, Math.PI * 2); ctx.fillStyle = a[4]; ctx.fill(); }
    else if (t === "l") { ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(a[2], a[3]); ctx.strokeStyle = a[4]; ctx.lineWidth = a[5] || 6; ctx.stroke(); }
    else if (t === "a") { ctx.beginPath(); ctx.arc(a[0], a[1], a[2], a[3], a[4]); ctx.strokeStyle = a[5]; ctx.lineWidth = 7; ctx.stroke(); }
  }
  function drawSeg(x1, y1, x2, y2, color, w) {
    ctx.save();
    if (color === "erase") { ctx.globalCompositeOperation = "destination-out"; ctx.lineWidth = w * 3; }
    else { ctx.strokeStyle = color; ctx.lineWidth = w; }
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
    ctx.restore();
  }

  /* ---------- 单人模式：AI 作画 ---------- */
  function startSingle() {
    mode = "single";
    clearInterval(timer); over = false; step = 0;
    ctx.clearRect(0, 0, 400, 400);
    // 个人不重复出题：全出完一轮才重置
    let seen; try { seen = JSON.parse(localStorage.getItem("pt_guess_seen")) || []; } catch (e) { seen = []; }
    let pool = GUESS_WORDS.map((_, i) => i).filter(i => !seen.includes(i));
    if (!pool.length) { pool = GUESS_WORDS.map((_, i) => i); seen = []; statEl.textContent = "词库已玩完一轮，重新开始洗牌！"; }
    const idx = pool[rndi(0, pool.length - 1)];
    seen.push(idx);
    localStorage.setItem("pt_guess_seen", JSON.stringify(seen));
    item = GUESS_WORDS[idx];
    statEl.textContent = "AI 作画中… 在下方输入你的猜测！";
    timer = setInterval(() => {
      if (step < item.ops.length) {
        execOp(item.ops[step]); step++;
        if (step % 3 === 0) SFX.tick();
      } else clearInterval(timer);
    }, 420);
  }
  function singleGuess(v) {
    if (over || !item) return;
    const ok = v === item.w || (item.w.length > 1 && v.includes(item.w)) || (v.length > 1 && item.w.includes(v));
    if (ok) {
      over = true; clearInterval(timer);
      while (step < item.ops.length) execOp(item.ops[step++]);
      SFX.win();
      showModal("🎉 猜对了！", ["答案就是：<b style='color:var(--accent)'>" + item.w + "</b>"],
        [{ label: "下一题", primary: true, onClick: startSingle },
         { label: "返回主菜单", onClick: () => show(menuView) }]);
    } else { SFX.error(); statEl.textContent = "「" + v + "」不对，再想想～"; }
  }

  /* ---------- 联机模式：真人轮流作画 ---------- */
  function pickWord() {
    if (usedIdx.size >= GUESS_ALL.length) usedIdx = new Set();
    let i; do { i = rndi(0, GUESS_ALL.length - 1); } while (usedIdx.has(i));
    usedIdx.add(i); return i;
  }
  function hostStartRound() {
    const members = room.members;
    if (!members.length) return;
    const idx = members.findIndex(m => m.uid === drawerUid);
    const next = members[(idx + 1) % members.length];
    const p = { drawer: next.uid, drawerName: next.name, word: GUESS_ALL[pickWord()] };
    room.send("round", p); onRound(p);
  }
  function onRound(p) {
    over = false; drawerUid = p.drawer; curWord = p.word;
    strokeList = []; redoStrokes = [];
    ctx.clearRect(0, 0, 400, 400);
    const meDrawer = room.me() === drawerUid;
    tools.style.display = meDrawer ? "block" : "none";
    statEl.textContent = meDrawer ? ("✏️ 你画这个词：「" + curWord + "」（别说出来哦）") : ("🖌 " + p.drawerName + " 正在作画，在聊天框抢答！");
    if (chat) chat.addSys("新一轮开始，轮到 " + p.drawerName + " 作画");
  }
  function onGuess(p) {
    if (chat) chat.add(p.who, p.avatar, p.text);
    if (over || !curWord) return;
    const ok = p.text === curWord || (curWord.length > 1 && p.text.includes(curWord)) || (p.text.length > 1 && curWord.includes(p.text));
    if (ok) {
      over = true; SFX.win();
      const w = { who: p.who, word: curWord };
      room.send("win", w); onWin(w);
    }
  }
  function onWin(p) {
    over = true;
    SFX.win();
    if (chat) chat.add("🤖 AI 主持人", "", "🎉 恭喜 " + p.who + " 猜对了！答案是「" + p.word + "」，3 秒后换下一位作画～");
    if (room && room.isHost) setTimeout(() => { if (room) hostStartRound(); }, 3000);
  }
  // 画笔画布事件（仅作画者生效）
  let drawing = false, lastP = null;
  let strokeList = [], redoStrokes = [];
  function redrawStrokes() {
    ctx.clearRect(0, 0, 400, 400);
    strokeList.forEach(s => drawSeg(s.x1, s.y1, s.x2, s.y2, s.c, s.w));
  }
  function doUndo() {   // 作画者本地撤销
    const s = strokeList.pop();
    if (!s) { SFX.error(); return; }
    redoStrokes.push(s); redrawStrokes(); SFX.click();
  }
  function doRedo() {   // 作画者本地重做
    const s = redoStrokes.pop();
    if (!s) { SFX.error(); return; }
    strokeList.push(s); drawSeg(s.x1, s.y1, s.x2, s.y2, s.c, s.w); SFX.click();
    return s;
  }
  function posOf(e) {
    const r = cv.getBoundingClientRect();
    return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height];
  }
  cv.addEventListener("pointerdown", e => {
    if (mode !== "room" || over || !room || room.me() !== drawerUid) return;
    drawing = true; lastP = posOf(e);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
  });
  cv.addEventListener("pointermove", e => {
    if (!drawing) return;
    const p = posOf(e);
    const s = { x1: lastP[0], y1: lastP[1], x2: p[0], y2: p[1], c: erasing ? "erase" : brushColor, w: brushW };
    drawSeg(s.x1, s.y1, s.x2, s.y2, s.c, s.w);
    strokeList.push(s); redoStrokes = [];
    room.send("stroke", s);
    lastP = p;
  });
  const stopDraw = () => { drawing = false; };
  cv.addEventListener("pointerup", stopDraw);
  cv.addEventListener("pointercancel", stopDraw);
  const undoDrawBtn = el("button", "btn", "↩"); undoDrawBtn.title = "撤销一笔"; undoDrawBtn.style.cssText = "padding:4px 10px;font-size:13px;margin:2px";
  const redoDrawBtn = el("button", "btn", "↪"); redoDrawBtn.title = "重做一笔"; redoDrawBtn.style.cssText = "padding:4px 10px;font-size:13px;margin:2px";
  undoDrawBtn.onclick = () => { if (room && room.me() === drawerUid) { doUndo(); room.send("undo", {}); } };
  redoDrawBtn.onclick = () => { if (room && room.me() === drawerUid) { const s = doRedo(); if (s) room.send("redo", s); } };
  tools.appendChild(undoDrawBtn); tools.appendChild(redoDrawBtn);
  clearBtn.onclick = () => {
    if (room && room.me() === drawerUid) { strokeList = []; redoStrokes = []; ctx.clearRect(0, 0, 400, 400); room.send("clear", {}); }
  };

  function bindRoom(rm, cht) {
    room = rm; chat = cht;
    rm.on("begin", () => { mode = "room"; stage.style.display = "flex"; if (lobby) lobby.setPlaying(true); });
    rm.on("round", onRound);
    rm.on("guess", onGuess);
    rm.on("win", onWin);
    rm.on("stroke", p => { strokeList.push(p); drawSeg(p.x1, p.y1, p.x2, p.y2, p.c, p.w); });
    rm.on("clear", () => { strokeList = []; ctx.clearRect(0, 0, 400, 400); });
    rm.on("undo", () => { if (strokeList.pop()) redrawStrokes(); });
    rm.on("redo", p => { strokeList.push(p); drawSeg(p.x1, p.y1, p.x2, p.y2, p.c, p.w); });
  }

  // 入口选择：单人 / 联机大厅
  const gate = el("div");
  gate.style.cssText = "text-align:center;margin:14px auto;max-width:520px";
  const singleBtn = el("button", "btn primary", "🎯 单人：AI 画我来猜"); singleBtn.style.cssText = "width:100%;margin-bottom:8px";
  const multiBtn = el("button", "btn mint", "👥 多人联机：轮流画大家猜"); multiBtn.style.cssText = "width:100%";
  gate.appendChild(singleBtn); gate.appendChild(multiBtn);
  root.appendChild(gate);

  singleBtn.onclick = () => { SFX.click(); gate.style.display = "none"; stage.style.display = "flex"; startSingle(); };
  multiBtn.onclick = () => {
    SFX.click();
    if (!sb || !currentUser) { showModal("提示", ["多人联机需要先在右上角 👤 登录"], [{ label: "知道了", primary: true }]); return; }
    gate.style.display = "none";
    lobby = buildLobby("你画我猜",
      rm => { rm.send("begin", {}); mode = "room"; stage.style.display = "flex"; hostStartRound(); },
      (rm, cht) => bindRoom(rm, cht));
    root.appendChild(lobby.el);
  };

  // 单人模式的猜词输入框
  const singleBox = el("div");
  singleBox.style.cssText = "max-width:480px;margin:12px auto 0;display:none";
  const input = el("input", "guess-input"); input.placeholder = "AI 画的是…？输入后回车";
  const row = el("div", "mode-row");
  const guessBtn = el("button", "btn primary", "猜！"); guessBtn.style.flex = "1";
  const giveupBtn = el("button", "btn", "🙈 放弃看答案");
  row.appendChild(guessBtn); row.appendChild(giveupBtn);
  singleBox.appendChild(input); singleBox.appendChild(row);
  root.appendChild(singleBox);
  const showSingleBox = () => { singleBox.style.display = "block"; };
  const _origSingleClick = singleBtn.onclick;
  singleBtn.onclick = () => { _origSingleClick(); showSingleBox(); };
  const doSingleGuess = () => { const v = input.value.trim(); if (v) singleGuess(v); input.value = ""; input.focus(); };
  guessBtn.onclick = doSingleGuess;
  input.addEventListener("keydown", e => { if (e.key === "Enter") doSingleGuess(); e.stopPropagation(); });
  giveupBtn.onclick = () => {
    if (over || !item) return;
    over = true; clearInterval(timer);
    while (step < item.ops.length) execOp(item.ops[step++]);
    showModal("🙈 揭晓答案", ["这题是：<b style='color:var(--accent)'>" + item.w + "</b>"],
      [{ label: "下一题", primary: true, onClick: startSingle },
       { label: "返回主菜单", onClick: () => show(menuView) }]);
  };

  const keyH = e => { if (e.key === "Escape") show(menuView); };
  window.addEventListener("keydown", keyH);
  return () => { clearInterval(timer); window.removeEventListener("keydown", keyH); if (room) room.leave(); };
}

function spyView(root) {
  root.appendChild(backBar("🕵️ 谁是卧底"));
  if (!sb || !currentUser) {
    root.appendChild(el("div", "hint", "🕵️ 谁是卧底是多人联机游戏，需要先在右上角 👤 登录"));
  }
  // 游戏面板（开局后显示）
  const panel = el("div");
  panel.style.cssText = "max-width:560px;margin:12px auto;background:var(--panel);border:2px solid var(--panel-2);border-radius:20px;padding:18px;display:none";
  const wordCard = el("div");
  wordCard.style.cssText = "font-size:28px;font-weight:bold;color:var(--accent);background:var(--panel-2);border:2px dashed var(--accent);border-radius:16px;padding:16px;margin:8px 0";
  const phaseEl = el("div", "hint");
  const voteDiv = el("div"); voteDiv.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0";
  const hostRow = el("div"); hostRow.style.cssText = "display:flex;gap:8px;justify-content:center;margin-top:8px";
  const voteBtn = el("button", "btn primary", "🗳️ 开始投票"); voteBtn.style.display = "none";
  const againBtn = el("button", "btn mint", "🔁 再来一局"); againBtn.style.display = "none";
  hostRow.appendChild(voteBtn); hostRow.appendChild(againBtn);
  panel.appendChild(el("h3", null, "🕵️ 谁是卧底"));
  panel.appendChild(wordCard); panel.appendChild(phaseEl); panel.appendChild(voteDiv); panel.appendChild(hostRow);
  root.appendChild(panel);

  let lobby = null, room = null, chat = null;
  let myWord = "", civWord = "", spyWord = "", spyUid = null, phase = "lobby";
  let votes = {}, usedPairs = new Set(), voted = false;

  function pickPair() {
    if (usedPairs.size >= SPY_PAIRS.length) usedPairs = new Set();
    let i; do { i = rndi(0, SPY_PAIRS.length - 1); } while (usedPairs.has(i));
    usedPairs.add(i); return SPY_PAIRS[i];
  }
  function hostDeal() {
    const members = room.members;
    if (members.length < 3) { showModal("提示", ["谁是卧底至少 3 人开局，再等等朋友吧～"], [{ label: "好的", primary: true }]); return; }
    const pair = pickPair();
    const flip = rndi(0, 1) === 1;
    civWord = pair[flip ? 0 : 1]; spyWord = pair[flip ? 1 : 0];
    const spy = members[rndi(0, members.length - 1)];
    spyUid = spy.uid; votes = {};
    room.send("begin", { spyUid, civWord, spyWord });
    members.forEach(m => {
      const w = m.uid === spyUid ? spyWord : civWord;
      room.send("role", { to: m.uid, word: w });
      if (m.uid === room.me()) myWord = w;
    });
    phase = "describe"; voted = false;
    showGame("describe");
    if (chat) chat.addSys("新一局开始！词语已悄悄发给每个人");
  }
  function showGame(ph) {
    phase = ph;
    panel.style.display = "block";
    if (lobby) lobby.setPlaying(true);
    voteDiv.innerHTML = "";
    voteBtn.style.display = "none"; againBtn.style.display = "none";
    if (ph === "describe") {
      wordCard.textContent = "你的词：「" + myWord + "」";
      phaseEl.textContent = "💬 描述阶段：在下方聊天框描述你的词（别说原词！），卧底要装成平民";
      if (room.isHost) voteBtn.style.display = "inline-block";
    } else if (ph === "vote") {
      phaseEl.textContent = "🗳️ 投票阶段：点你觉得最像卧底的人";
      voted = false;
      room.members.forEach(m => {
        if (m.uid === room.me()) return;
        const b = el("button", "btn", m.avatar + " " + m.name);
        b.onclick = () => {
          if (voted) return;
          voted = true; SFX.click();
          const p = { from: room.me(), target: m.uid };
          room.send("vote", p); recordVote(p);
          voteDiv.querySelectorAll("button").forEach(x => x.disabled = true);
          phaseEl.textContent = "已投给 " + m.name + "，等待其他人…";
        };
        voteDiv.appendChild(b);
      });
    }
  }
  function recordVote(p) {
    if (!room.isHost) return;
    votes[p.from] = p.target;
    const total = Object.keys(votes).length;
    if (chat) chat.addSys("已收 " + total + "/" + room.members.length + " 票");
    if (total >= room.members.length) {
      const count = {};
      Object.values(votes).forEach(t => { count[t] = (count[t] || 0) + 1; });
      let maxT = null, maxC = -1;
      Object.keys(count).forEach(t => { if (count[t] > maxC) { maxC = count[t]; maxT = t; } });
      const r = { spyUid, out: maxT, civWord, spyWord, spyCaught: maxT === spyUid };
      room.send("result", r); onResult(r);
    }
  }
  function nameOf(uid) {
    const m = room.members.find(x => x.uid === uid);
    return m ? m.avatar + " " + m.name : "神秘人";
  }
  function onResult(r) {
    const caughtTxt = r.spyCaught ? "✅ 卧底被抓住了！平民胜利 🎉" : "❌ 抓错人啦！卧底胜利 🕵️";
    showModal("🕵️ 揭晓时刻", [
      "卧底是：" + nameOf(r.spyUid),
      "被投出：" + (r.out ? nameOf(r.out) : "无人"),
      "平民词：「" + r.civWord + "」 vs 卧底词：「" + r.spyWord + "」",
      caughtTxt,
    ], room.isHost
      ? [{ label: "🔁 再来一局", primary: true, onClick: hostDeal },
         { label: "返回主菜单", onClick: () => show(menuView) }]
      : [{ label: "等房主开新局", primary: true, onClick: () => {} },
         { label: "返回主菜单", onClick: () => show(menuView) }]);
    if (r.spyCaught) SFX.win(); else SFX.lose();
    if (room.isHost) againBtn.style.display = "inline-block";
    phaseEl.textContent = "本局结束";
    voteDiv.innerHTML = "";
  }
  function bindSpy(rm, cht) {
    room = rm; chat = cht;
    rm.on("begin", () => { votes = {}; voted = false; phase = "describe"; panel.style.display = "block"; });
    rm.on("role", p => { if (p.to === room.me()) { myWord = p.word; showGame("describe"); } });
    rm.on("voteStart", () => showGame("vote"));
    rm.on("vote", recordVote);
    rm.on("result", onResult);
  }
  voteBtn.onclick = () => { room.send("voteStart", {}); showGame("vote"); };
  againBtn.onclick = hostDeal;

  lobby = buildLobby("谁是卧底",
    rm => { hostDeal(); },
    (rm, cht) => bindSpy(rm, cht));
  root.appendChild(lobby.el);

  const keyH = e => { if (e.key === "Escape") show(menuView); };
  window.addEventListener("keydown", keyH);
  return () => { window.removeEventListener("keydown", keyH); if (room) room.leave(); };
}

function snakeView(root) {
  root.appendChild(backBar("🐍 贪吃蛇", {
    title: "贪吃蛇", game: "snake", total: SNAKE_LEVELS,
    onPick: (i) => { lv = i; reset(); }
  }));
  const stage = el("div", "stage");
  const cv = makeCanvas(480, 480);
  stage.appendChild(cv);
  const side = el("div", "side-panel");
  const lvEl = el("div", "row"); lvEl.style.cssText = "font-weight:bold;color:var(--accent)";
  const foodEl = el("div", "row");
  side.appendChild(el("h3", null, "关卡信息"));
  side.appendChild(lvEl); side.appendChild(foodEl);
  side.appendChild(el("h3", null, "方向控制"));
  const dpad = el("div", "dpad");
  side.appendChild(dpad);
  const againBtn = el("button", "btn primary", "重开本关"); againBtn.style.width = "100%";
  side.appendChild(againBtn);
  stage.appendChild(side);
  root.appendChild(stage);
  root.appendChild(el("div", "hint", "方向键 / WASD / 屏幕方向键 · 吃满目标数过关 · ESC 返回"));

  const ctx = cv.getContext("2d");
  const N = 20, CELL = 24;
  let lv = 0, snake, dir, dirQueue, food, eaten, goal, timer = null, dead = false, passed = false;

  const goalFor = i => 5 + i;
  const speedFor = i => Math.max(70, 170 - i * 6);

  function startLevel(i) {
    lv = i;
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 }; dirQueue = [];
    eaten = 0; goal = goalFor(i); dead = false; passed = false;
    placeFood();
    updSide();
    clearInterval(timer);
    timer = setInterval(stepFn, speedFor(i));
    draw();
  }
  function updSide() {
    lvEl.textContent = `第 ${lv + 1} / ${SNAKE_LEVELS} 关`;
    foodEl.textContent = `已吃 ${eaten} / ${goal} 个`;
  }
  function placeFood() {
    while (true) {
      const f = { x: rndi(0, N - 1), y: rndi(0, N - 1) };
      if (!snake.some(s => s.x === f.x && s.y === f.y)) { food = f; return; }
    }
  }
  function turn(dx, dy) {
    if (dead || passed) return;
    dirQueue.push({ x: dx, y: dy });
  }
  function stepFn() {
    if (dead || passed) return;
    while (dirQueue.length) {
      const d = dirQueue.shift();
      if (d.x !== -dir.x || d.y !== -dir.y) { dir = d; break; }
    }
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    if (head.x < 0 || head.y < 0 || head.x >= N || head.y >= N ||
        snake.some(s => s.x === head.x && s.y === head.y)) {
      dead = true; SFX.lose(); clearInterval(timer);
      showModal("💥 撞上了！", [`第 ${lv + 1} 关失败，吃了 ${eaten} 个`],
        [{ label: "重开本关", primary: true, onClick: () => startLevel(lv) },
         { label: "返回主菜单", onClick: () => show(menuView) }]);
      return;
    }
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      eaten++; SFX.eat(); updSide();
      if (eaten >= goal) {
        passed = true; clearInterval(timer); SFX.win();
        saveLevel("snake", Math.min(SNAKE_LEVELS, lv + 2));
        const newToys = checkToyUnlocks();
        const last = lv + 1 >= SNAKE_LEVELS;
        showModal(last ? "🏆 全部通关！" : "🎉 过关！",
          [(last ? `你完成了全部 ${SNAKE_LEVELS} 关！` : `第 ${lv + 1} 关完成！`) + (newToys.length ? "\n🎁 解锁新玩具：" + newToys.map(t => t.emoji + t.name).join("、") : "")],
          last ? [{ label: "重新游玩", primary: true, onClick: () => startLevel(0) },
                  { label: "返回主菜单", onClick: () => show(menuView) }]
               : [{ label: "下一关", primary: true, onClick: () => startLevel(lv + 1) },
                  { label: "返回主菜单", onClick: () => show(menuView) }]);
        draw();
        return;
      }
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }
  function draw() {
    ctx.clearRect(0, 0, 480, 480);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#f4efe4" : "#faf5ea";
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
    }
    // 食物（小苹果）
    ctx.fillStyle = "#ff8d9d";
    ctx.beginPath(); ctx.arc(food.x * CELL + 12, food.y * CELL + 13, 8, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "#7fb069"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(food.x * CELL + 12, food.y * CELL + 6); ctx.lineTo(food.x * CELL + 15, food.y * CELL + 2); ctx.stroke();
    // 蛇
    snake.forEach((s, i) => {
      ctx.fillStyle = i === 0 ? "#5cb87f" : "#8adab2";
      ctx.beginPath();
      ctx.roundRect(s.x * CELL + 2, s.y * CELL + 2, CELL - 4, CELL - 4, 6);
      ctx.fill();
      if (i === 0) {
        ctx.fillStyle = "#2f5a48";
        ctx.beginPath(); ctx.arc(s.x * CELL + 8, s.y * CELL + 9, 2.4, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(s.x * CELL + 16, s.y * CELL + 9, 2.4, 0, Math.PI * 2); ctx.fill();
      }
    });
  }
  [["e"], ["u", 0, -1], ["e"], ["l", -1, 0], ["e"], ["r", 1, 0], ["e"], ["d", 0, 1], ["e"]].forEach(([k, dx, dy]) => {
    if (k === "e") { dpad.appendChild(el("div", "empty")); return; }
    const b = el("button", "btn", { u: "↑", l: "←", r: "→", d: "↓" }[k]);
    b.onclick = () => turn(dx, dy);
    dpad.appendChild(b);
  });
  const keyH = (e) => {
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    const m = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] }[k];
    if (m) { e.preventDefault(); turn(m[0], m[1]); }
    if (e.key === "Escape") show(menuView);
  };
  window.addEventListener("keydown", keyH);
  againBtn.onclick = () => { SFX.click(); startLevel(lv); };
  startLevel(getLevel("snake", SNAKE_LEVELS) - 1);
  return () => { clearInterval(timer); window.removeEventListener("keydown", keyH); };
}

          [`用了 ${digMoves} 步完成 ${DIGIT_LEVELS[digLv].name}`],
          last ? [{ label: "重新挑战", primary: true, onClick: () => startDigit(0) },

    cv.style.margin = "0 auto";
    stage.insertBefore(cv, side);

    cv.onclick = (e) => {

  // ---- 三国华容道 ----
  let lv = 0, pieces, sel = null, moves;

      showModal(last ? "🏆 全部通关！" : "🎉 过关！",
        [`「${HRD_LEVELS[lv].name}」用了 ${moves} 步` + (last ? "，恭喜通关全部关卡！" : "，曹操成功脱困！")],
        last ? [{ label: "重新游玩", primary: true, onClick: () => startLevel(0) },
                { label: "返回主菜单", onClick: () => show(menuView) }]

                { label: "返回主菜单", onClick: () => show(menuView) }]);

  function drawSanguo() {

    ctx.fillStyle = "#f4e9d8"; ctx.fillRect(0, 0, COLS * CELL, ROWS * CELL);
    ctx.fillStyle = "rgba(138,218,178,.45)";
    ctx.fillRect(CELL, (ROWS - 1) * CELL, CELL * 2, CELL);

    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("出 口", CELL * 2, (ROWS - 0.5) * CELL);

      const x = p.c * CELL + 4, y = p.r * CELL + 4, w = p.w * CELL - 8, h = p.h * CELL - 8;
      ctx.fillStyle = p.color;

      if (p === sel) { ctx.strokeStyle = "#5a4a42"; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(x, y, w, h, 12); ctx.stroke(); }

      ctx.textAlign = "center"; ctx.textBaseline = "middle";

function matchView(root) {
  root.appendChild(backBar("💎 宝石消消乐", {
    title: "消消乐", game: "match", total: MATCH_LEVELS,
    onPick: (i) => { lv = i; newBoard(); updSide(); }
  }));
  const stage = el("div", "stage");
  const cv = makeCanvas(480, 480);
  stage.appendChild(cv);
  const side = el("div", "side-panel");
  side.appendChild(el("h3", null, "关卡信息"));
  const lvEl = el("div", "row");
  const scoreEl = el("div", "row"); scoreEl.style.cssText = "font-size:26px;font-weight:bold;color:var(--accent)";
  const targetEl = el("div", "row"); targetEl.style.color = "var(--text-dim)";
  side.appendChild(lvEl); side.appendChild(scoreEl); side.appendChild(targetEl);
  const againBtn = el("button", "btn primary", "重开本关"); againBtn.style.cssText = "width:100%;margin-top:12px";
  side.appendChild(againBtn);
  const tip = el("div", "row"); tip.style.cssText = "color:var(--text-dim);font-size:13px;line-height:1.7;margin-top:12px";
  tip.textContent = "点击两个相邻宝石交换，三连消除。连锁消除得分翻倍！";
  side.appendChild(tip);
  stage.appendChild(side);
  root.appendChild(stage);
  root.appendChild(el("div", "hint", "ESC 返回主菜单"));

  const ctx = cv.getContext("2d");
  const N = 8, CELL = 60;
  const GEMS = ["#ff8d9d", "#ffb56e", "#ffd97a", "#7fd6a4", "#8ecfff", "#d3b3f7"];
  let grid, sel = null, score = 0, busy = false, lv = 0, target = 0, passed = false;

  const levelTarget = i => 300 + i * 200;
  function newGrid() {
    grid = Array.from({ length: N }, () => Array(N).fill(0));
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      let v;
      do { v = rndi(0, GEMS.length - 1); }
      while ((c >= 2 && grid[r][c-1] === v && grid[r][c-2] === v) ||
             (r >= 2 && grid[r-1][c] === v && grid[r-2][c] === v));
      grid[r][c] = v;
    }
  }
  function findMatches() {
    const hit = new Set();
    for (let r = 0; r < N; r++) for (let c = 0; c < N - 2; c++) {
      const v = grid[r][c];
      if (v >= 0 && grid[r][c+1] === v && grid[r][c+2] === v)
        [c, c+1, c+2].forEach(cc => hit.add(r + "," + cc));
    }
    for (let c = 0; c < N; c++) for (let r = 0; r < N - 2; r++) {
      const v = grid[r][c];
      if (v >= 0 && grid[r+1][c] === v && grid[r+2][c] === v)
        [r, r+1, r+2].forEach(rr => hit.add(rr + "," + c));
    }
    return [...hit].map(s => s.split(",").map(Number));
  }
  function collapse() {
    for (let c = 0; c < N; c++) {
      let write = N - 1;
      for (let r = N - 1; r >= 0; r--) if (grid[r][c] >= 0) { grid[write][c] = grid[r][c]; if (write !== r) grid[r][c] = -1; write--; }
      for (let r = write; r >= 0; r--) grid[r][c] = rndi(0, GEMS.length - 1);
    }
  }
  function updSide() {
    lvEl.textContent = `第 ${lv + 1} / ${MATCH_LEVELS} 关`;
    scoreEl.textContent = "分数 " + score;
    targetEl.textContent = "目标 " + target;
  }
  async function resolveBoard() {
    let combo = 1;
    while (true) {
      const m = findMatches();
      if (!m.length) break;
      m.forEach(([r, c]) => grid[r][c] = -1);
      score += m.length * 10 * combo; combo++;
      SFX.match();
      updSide(); draw(); await sleep(220);
      collapse(); draw(); await sleep(220);
    }
    if (!passed && score >= target) {
      passed = true; SFX.win();
      saveLevel("match", Math.min(MATCH_LEVELS, lv + 2));
      checkToyUnlocks();
      const last = lv + 1 >= MATCH_LEVELS;
      showModal(last ? "🏆 全部通关！" : "🎉 过关！",
        [last ? `你完成了全部 ${MATCH_LEVELS} 关！` : `第 ${lv + 1} 关达标！分数 ${score} / ${target}`],
        last ? [{ label: "重新游玩", primary: true, onClick: () => startLevel(0) },
                { label: "返回主菜单", onClick: () => show(menuView) }]
             : [{ label: "下一关", primary: true, onClick: () => startLevel(lv + 1) },
                { label: "返回主菜单", onClick: () => show(menuView) }]);
    }
  }
  function draw() {
    ctx.clearRect(0, 0, 480, 480);
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#f4efe4" : "#faf5ea";
      ctx.fillRect(c * CELL, r * CELL, CELL, CELL);
      const v = grid[r][c];
      if (v < 0) continue;
      const x = c * CELL + CELL / 2, y = r * CELL + CELL / 2, rad = CELL * 0.32;
      ctx.beginPath();
      ctx.moveTo(x, y - rad); ctx.lineTo(x + rad * 0.8, y); ctx.lineTo(x, y + rad); ctx.lineTo(x - rad * 0.8, y);
      ctx.closePath(); ctx.fillStyle = GEMS[v]; ctx.fill();
      ctx.beginPath();
      ctx.moveTo(x, y - rad * 0.55); ctx.lineTo(x + rad * 0.4, y); ctx.lineTo(x, y + rad * 0.55); ctx.lineTo(x - rad * 0.4, y);
      ctx.closePath(); ctx.fillStyle = "rgba(255,255,255,.5)"; ctx.fill();
    }
    if (sel) {
      ctx.strokeStyle = "#5a4a42"; ctx.lineWidth = 3;
      ctx.strokeRect(sel[1] * CELL + 2, sel[0] * CELL + 2, CELL - 4, CELL - 4);
    }
  }
  cv.addEventListener("mousedown", async (e) => {
    if (busy || passed) return;
    const [px, py] = evXY(e, cv);
    const c = Math.floor(px / CELL);
    const r = Math.floor(py / CELL);
    if (r < 0 || c < 0 || r >= N || c >= N) return;
    if (!sel) { sel = [r, c]; SFX.click(); draw(); return; }
    if (sel[0] === r && sel[1] === c) { sel = null; draw(); return; }
    if (Math.abs(sel[0] - r) + Math.abs(sel[1] - c) !== 1) { sel = [r, c]; draw(); return; }
    busy = true;
    const [sr, sc] = sel; sel = null;
    [grid[sr][sc], grid[r][c]] = [grid[r][c], grid[sr][sc]];
    SFX.place(); draw(); await sleep(150);
    if (findMatches().length === 0) {
      [grid[sr][sc], grid[r][c]] = [grid[r][c], grid[sr][sc]];
      SFX.error(); draw();
    } else {
      await resolveBoard();
    }
    busy = false;
  });
  function startLevel(i) {
    lv = i; score = 0; target = levelTarget(i); passed = false; sel = null;
    newGrid(); updSide(); draw();
  }
  againBtn.onclick = () => { SFX.click(); startLevel(lv); };
  startLevel(getLevel("match", MATCH_LEVELS) - 1);
  return onEsc();
}
