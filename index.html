   ================================================================ */
function genSudoku(holes) {
  const g = Array.from({ length: 9 }, () => Array(9).fill(0));
  function valid(r, c, v) {
    for (let i = 0; i < 9; i++) if (g[r][i] === v || g[i][c] === v) return false;
    const br = r - r % 3, bc = c - c % 3;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (g[br+i][bc+j] === v) return false;
    return true;
  }
  function fill() {
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      if (g[r][c]) continue;
      const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - .5);
      for (const v of nums) if (valid(r, c, v)) { g[r][c] = v; if (fill()) return true; g[r][c] = 0; }
      return false;
    }
    return true;
  }
  fill();
  const pos = [];
  for (let i = 0; i < 81; i++) pos.push(i);
  pos.sort(() => Math.random() - .5);
  for (let i = 0; i < holes; i++) g[Math.floor(pos[i] / 9)][pos[i] % 9] = 0;
  return g;
}

  const CELL = 60;
  let grid, fixed, sel = null, lv = getLevel("sudoku", SUDOKU_LEVELS) - 1, autoFill = false;
  let hist = [], redoStk = [];   // 撤销/重做：每条是一组 {r,c,old,v}
  const holesFor = i => 32 + i;

  function autoFillBoard() {
    let changed = true; const batch = [];
    while (changed) {
      changed = false;
      for (let r = 0; r < 9; r++) {
        const empties = [], seen = new Set(); let dup = false;
        for (let c = 0; c < 9; c++) { const v = grid[r][c]; if (!v) empties.push(c); else { if (seen.has(v)) dup = true; seen.add(v); } }
        if (empties.length === 1 && !dup) {
          const miss = [1,2,3,4,5,6,7,8,9].find(n => !seen.has(n));
          if (miss !== undefined) { batch.push({ r, c: empties[0], old: 0, v: miss }); grid[r][empties[0]] = miss; changed = true; }
        }
      }
      for (let c = 0; c < 9; c++) {
        const empties = [], seen = new Set(); let dup = false;
        for (let r = 0; r < 9; r++) { const v = grid[r][c]; if (!v) empties.push(r); else { if (seen.has(v)) dup = true; seen.add(v); } }
        if (empties.length === 1 && !dup) {
          const miss = [1,2,3,4,5,6,7,8,9].find(n => !seen.has(n));
          if (miss !== undefined) { batch.push({ r: empties[0], c, old: 0, v: miss }); grid[empties[0]][c] = miss; changed = true; }
        }
      }
    }
    if (batch.length) { hist.push(batch); redoStk = []; SFX.reveal(); draw(); }
  }
  function undo() {
    const b = hist.pop();
    if (!b) { SFX.error(); return; }
    redoStk.push(b);
    b.forEach(({ r, c, old }) => { grid[r][c] = old; });
    SFX.click(); draw();
  }
  function redo() {
    const b = redoStk.pop();
    if (!b) { SFX.error(); return; }
    hist.push(b);
    b.forEach(({ r, c, v }) => { grid[r][c] = v; });
    SFX.click(); draw();
  }

  function reset() {
    const puzzle = genSudoku(holesFor(lv));
    grid = puzzle.map(r => r.slice());
    fixed = puzzle.map(r => r.map(v => v !== 0));
    sel = null; hist = []; redoStk = [];
    lvEl.textContent = `第 ${lv + 1} / ${SUDOKU_LEVELS} 关（空 ${holesFor(lv)} 格）`;
    draw();
  }
  function conflicts(r, c) {
    const v = grid[r][c];
    if (!v) return false;
    for (let i = 0; i < 9; i++) {
      if (i !== c && grid[r][i] === v) return true;
      if (i !== r && grid[i][c] === v) return true;
    }
    const br = r - r % 3, bc = c - c % 3;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      if ((br + i !== r || bc + j !== c) && grid[br+i][bc+j] === v) return true;
    return false;
  }
  function draw() {
    ctx.clearRect(0, 0, 540, 540);
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      ctx.fillStyle = "#fffdf7";
      if (sel && sel[0] === r && sel[1] === c) ctx.fillStyle = "#ffe8ec";
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
      const v = grid[r][c];
      if (v) {
        ctx.font = (fixed[r][c] ? "bold " : "") + "28px Microsoft YaHei";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = fixed[r][c] ? "#5a4a42" : (conflicts(r, c) ? "#ff6b8d" : "#6aa8e8");
        ctx.fillText(v, c * CELL + CELL / 2, r * CELL + CELL / 2 + 1);
      }
    }
    ctx.strokeStyle = "#c9b8a8";
    for (let i = 0; i <= 9; i++) {
      ctx.lineWidth = i % 3 === 0 ? 3 : 1;
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 540); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(540, i * CELL); ctx.stroke();
    }
  }
  function input(v) {
    if (!sel) return;
    const [r, c] = sel;
    if (fixed[r][c]) { SFX.error(); return; }
    if (grid[r][c] === v) return;
    hist.push([{ r, c, old: grid[r][c], v }]); redoStk = [];
    grid[r][c] = v; SFX.place(); draw();
    if (autoFill) setTimeout(autoFillBoard, 60);
  }
  for (let v = 1; v <= 9; v++) {
    const b = el("button", "btn", String(v));
    b.onclick = () => input(v);
    pad.appendChild(b);
  }
  const clr = el("button", "btn", "清除");
  clr.onclick = () => input(0);
  pad.appendChild(clr);
  cv.addEventListener("mousedown", (e) => {
    const [px, py] = evXY(e, cv);
    const c = Math.floor(px / CELL);
    const r = Math.floor(py / CELL);
    if (r >= 0 && c >= 0 && r < 9 && c < 9) { sel = [r, c]; SFX.click(); draw(); }
  });
  const keyH = (e) => {
    if (/^[1-9]$/.test(e.key)) input(Number(e.key));
    if (e.key === "0" || e.key === "Delete" || e.key === "Backspace") input(0);
    if (e.ctrlKey && (e.key === "z" || e.key === "Z")) { e.preventDefault(); undo(); }
    if (e.ctrlKey && (e.key === "y" || e.key === "Y")) { e.preventDefault(); redo(); }
    if (e.key === "Escape") show(menuView);
  };
  window.addEventListener("keydown", keyH);
  function boardLegal() {
    for (let r = 0; r < 9; r++) {
      const seen = {};
      for (let c = 0; c < 9; c++) { const v = grid[r][c]; if (!v || seen[v]) return false; seen[v] = 1; }
    }
    for (let c = 0; c < 9; c++) {
      const seen = {};
      for (let r = 0; r < 9; r++) { const v = grid[r][c]; if (seen[v]) return false; seen[v] = 1; }
    }
    for (let br = 0; br < 9; br += 3) for (let bc = 0; bc < 9; bc += 3) {
      const seen = {};
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        const v = grid[br+i][bc+j]; if (seen[v]) return false; seen[v] = 1;
      }
    }
    return true;
  }
  checkBtn.onclick = () => {
    const empty = grid.some(row => row.some(v => !v));
    if (empty) { SFX.error(); showModal("还没填完", ["还有空格未填写，继续加油！"], [{ label: "继续", primary: true }]); return; }
    if (boardLegal()) {
      SFX.win();
      saveLevel("sudoku", Math.min(SUDOKU_LEVELS, lv + 2));
      checkToyUnlocks();
      const last = lv + 1 >= SUDOKU_LEVELS;
      showModal(last ? "🏆 全部通关！" : "🎉 恭喜过关！",
        [last ? `你完成了全部 ${SUDOKU_LEVELS} 关！` : `第 ${lv + 1} 关答案正确！`],
        last ? [{ label: "重新游玩", primary: true, onClick: () => { lv = 0; reset(); } },
                { label: "返回主菜单", onClick: () => show(menuView) }]
             : [{ label: "下一关", primary: true, onClick: () => { lv++; reset(); } },
                { label: "返回主菜单", onClick: () => show(menuView) }]);
    } else {
      SFX.lose();
      showModal("答案有误", ["有填错的格子（红字为冲突提示），再检查一下。"], [{ label: "继续修改", primary: true }]);
    }
  };
  againBtn.onclick = () => { SFX.click(); reset(); };
  reset();
  return () => window.removeEventListener("keydown", keyH);
}

function brainView(root) {
  root.appendChild(backBar("🕵️ 脑力侦探", {
    title: "脑力侦探", game: "brain", total: BRAIN_CASES.length,
    onPick: (i) => { showCase(i); }
  }));
  const stage = el("div", "stage");
  root.appendChild(stage);
  const solved = new Set(); // 本次会话破过的，仅用于卡片标记补充

  function renderList(page) {
    stage.innerHTML = "";
    const PER = 12, pages = Math.ceil(BRAIN_CASES.length / PER);
    page = Math.max(0, Math.min(page || 0, pages - 1));
    const box = el("div"); box.style.cssText = "width:100%;text-align:center";
    box.appendChild(el("div", "game-title", "🕵️ 案件档案室"));
    box.appendChild(el("div", "hint", "阅读案情 → 在现场图中找出全部「疑点」→ 破案"));
    const grid = el("div", "game-grid"); grid.style.marginTop = "14px";
    const maxLv = getLevel("brain", BRAIN_CASES.length);
    for (let i = page * PER; i < Math.min((page + 1) * PER, BRAIN_CASES.length); i++) {
      const c = BRAIN_CASES[i];
      const locked = i + 1 > maxLv;
      const card = el("div", "card");
      card.style.padding = "16px 10px";
      if (locked) card.style.opacity = ".55";
      const tag = el("div", "lv-tag", locked ? "🔒" : (i + 1 < maxLv || solved.has(i) ? "✅已破" : "🔍新案"));
      card.appendChild(tag);
      card.appendChild(el("div", "icon", locked ? "🔒" : "🗂️"));
      card.appendChild(el("div", "name", "第 " + (i + 1) + " 案"));
      card.appendChild(el("div", "desc", locked ? "？" : c.t));
      card.onclick = () => {
        if (locked) { SFX.error(); return; }
        SFX.click(); showCase(i);
      };
      grid.appendChild(card);
    }
    box.appendChild(grid);
    const nav = el("div", "mode-row");
    const prev = el("button", "btn", "← 上一页"); prev.disabled = page === 0;
    prev.onclick = () => renderList(page - 1);
    const info = el("span", "row", (page + 1) + " / " + pages);
    const next = el("button", "btn", "下一页 →"); next.disabled = page >= pages - 1;
    next.onclick = () => renderList(page + 1);
    nav.appendChild(prev); nav.appendChild(info); nav.appendChild(next);
    box.appendChild(nav);
    stage.appendChild(box);
  }

  function showCase(i) {
    const C = BRAIN_CASES[i];
    stage.innerHTML = "";
    const wrap = el("div"); wrap.style.cssText = "width:100%;max-width:560px;margin:0 auto;text-align:center";
    wrap.appendChild(el("div", "game-title", "第 " + (i + 1) + " 案 · " + C.t));
    const story = el("div", "side-panel", "📋 案情：" + C.s);
    story.style.cssText = "text-align:left;font-size:14px;line-height:1.8;margin-bottom:10px";
    wrap.appendChild(story);
    const need = C.items.filter(it => it[3]).length;
    const status = el("div", "row");
    status.style.cssText = "font-weight:bold;color:var(--accent);margin:6px 0";
    wrap.appendChild(status);

    const cv = makeCanvas(520, 400); cv.style.width = "100%";
    const ctx = cv.getContext("2d");
    wrap.appendChild(cv);
    const msg = el("div", "hint"); msg.style.minHeight = "40px";
    wrap.appendChild(msg);
    const back = el("button", "btn", "← 回档案室"); back.onclick = () => renderList(0);
    wrap.appendChild(back);
    stage.appendChild(wrap);

    const found = new Set();
    function draw() {
      // 现场：昏黄墙面 + 木地板 + 聚光氛围
      const g = ctx.createLinearGradient(0, 0, 0, 400);
      g.addColorStop(0, "#7a6a58"); g.addColorStop(0.62, "#8a7a66");
      g.addColorStop(0.62, "#6d5b45"); g.addColorStop(1, "#5d4c39");
      ctx.fillStyle = g; ctx.fillRect(0, 0, 520, 400);
      ctx.fillStyle = "rgba(255,240,200,.10)";
      ctx.beginPath(); ctx.ellipse(260, 170, 230, 150, 0, 0, Math.PI * 2); ctx.fill();
      // 地板缝
      ctx.strokeStyle = "rgba(0,0,0,.15)"; ctx.lineWidth = 2;
      for (let y = 262; y < 400; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(520, y); ctx.stroke(); }
      // 物品
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      C.items.forEach((it, idx) => {
        const x = it[1] / 100 * 520, y = it[2] / 100 * 400;
        ctx.font = "34px sans-serif";
        ctx.fillText(it[0], x, y);
        if (found.has(idx)) {
          ctx.strokeStyle = "#7fd6a4"; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(x, y, 26, 0, Math.PI * 2); ctx.stroke();
          ctx.font = "18px sans-serif"; ctx.fillText("🔍", x + 22, y - 20);
        }
      });
    }
    function upd() { status.textContent = "🔍 疑点进度：" + found.size + " / " + need; draw(); }
    upd();

    cv.addEventListener("mousedown", (e) => {
      const [px, py] = evXY(e, cv);
      let best = -1, bd = 36;
      C.items.forEach((it, idx) => {
        const x = it[1] / 100 * 520, y = it[2] / 100 * 400;
        const d = Math.hypot(px - x, py - y);
        if (d < bd) { bd = d; best = idx; }
      });
      if (best < 0) return;
      const it = C.items[best];
      if (found.has(best)) return;
      if (it[3]) {
        found.add(best);
        SFX.reveal();
        msg.textContent = "✅ " + it[4];
        upd();
        if (found.size >= need) {
          setTimeout(() => {
            SFX.win();
            solved.add(i);
            const last = i + 1 >= BRAIN_CASES.length;
            if (!last) saveLevel("brain", i + 2);
            showModal("🎉 破案！", ["🔦 真相：" + C.truth],
              last
                ? [{ label: "🏆 全部侦破！回主菜单", primary: true, onClick: () => show(menuView) },
                   { label: "回档案室", onClick: () => { hideModal(); renderList(0); } }]
                : [{ label: "下一案 →", primary: true, onClick: () => { hideModal(); showCase(i + 1); } },
                   { label: "回档案室", onClick: () => { hideModal(); renderList(Math.floor(i / 12)); } }]);
          }, 500);
        }
      } else {
        SFX.error();
        msg.textContent = "❌ " + it[4] + "（这不是疑点）";
      }
    });
  }
  renderList(Math.floor((getLevel("brain", BRAIN_CASES.length) - 1) / 12));
  return onEsc();
}

  { t: "坐反的地铁", d: "★★",
    s: "男人每天下班都坐反方向的地铁，坐到终点再折返回家。",
    h: ["他不是坐错", "那段路线有特殊意义", "和去世的人有关"],
    b: "那是他年轻时接妻子下班的路线。妻子走后，他每天「绕远路」，像当年一样，把她回家的路再走一遍。" },
  { t: "留着的面", d: "★",
    s: "面馆老板每晚收摊前，都会留一碗面放在角落，谁也不许动。",
    h: ["留给一个不会来的人", "那人以前常来", "已经去世了"],
    b: "以前有位拾荒老人每晚来吃一碗最便宜的面。老人去世后，老板每晚仍留一碗：「万一人回来了呢，面得热乎。」" },
  { t: "望远镜", d: "★★",
    s: "男孩每天放学都用望远镜看对面山上好一会儿，雷打不动。",
    h: ["山上有座塔", "塔上有人", "是他爸爸"],
    b: "爸爸是山顶瞭望塔的护林员，一个月才下山一次。每天傍晚，父子俩就隔着山谷互相挥挥手。" },
  { t: "摇篮曲", d: "★★★",
    s: "半夜，婴儿监视器里传出温柔的摇篮曲——可她家里根本没有婴儿。",
    h: ["监视器没坏", "信号「串门」了", "邻居在用同款"],
    b: "婴儿监视器和邻居家同型号串了频道。她听到的摇篮曲，来自隔壁楼一位哄睡的妈妈——虚惊一场。" },
  { t: "定时的门铃", d: "★★★",
    s: "她搬新家后每晚十一点门铃准时响，猫眼里永远没人。报警后真相让她哭了。",
    h: ["不是人按的", "是定时留言", "和去世的人有关"],
    b: "前男友去世前用智能门铃给她设置了一年的定时留言，每晚一句「记得锁门，晚安」。警察查到后台记录时，留言还剩最后三天。" },
  { t: "倒着走的钟", d: "★★",
    s: "汤面：死者家中的座钟停在三点，家属说那正是案发时间，刑警看了一眼钟，却说有人在撒谎。",
    h: ["座钟没有坏，指针是被人拨停的", "撒谎的不是家属，是布置现场的人", "这只钟走的方向和普通钟不一样"],
    b: "汤底：凶手杀人后拨停座钟，想让警方以为案发于三点。但这是主人特制的逆时针座钟，钟面数字反向排列，他按普通钟的习惯把针拨到右侧三点位，在这只钟上读出来却是九点。伪造的案发时间当场露馅。" },

  { t: "满座的影厅", d: "★",
    s: "汤面：女人坚称案发当晚她在电影院，还留着票根，警察听完她的一句话就认定她在撒谎。",
    h: ["票根是真的", "她确实买了那张票", "问题出在她对影厅的描述"],
    b: "汤底：她说那晚影厅坐得满满当当。警方调取售票记录，那场冷门片全场只卖出三张票。她买了票却没进场，满座的细节是凭空编的，票根不过是花钱买来的不在场证明。" },

  { t: "迟到一小时的人", d: "★★",
    s: "汤面：公司里从不迟到的他，连续三天晚到一小时，第四天他恢复准时，当晚就死在了回家路上。",
    h: ["他不是起晚了，是故意晚出门", "他在避开每天同一时刻遇到的东西", "凶手比他更有耐心"],
    b: "汤底：他发现连续一周每天同一时刻都有个男人在同一路口与他「偶遇」。他故意把出门时间错开一小时躲避跟踪，第四天以为对方放弃便恢复了旧作息，却不知对方摸透的恰恰是他的旧作息。" },

  { t: "消失的邻居", d: "★★★",
    s: "汤面：邻居报警说隔壁一家三口凭空消失，警察进屋却发现一切如常：牙刷是湿的，桌上的饭菜还温着。",
    h: ["这家人没有离开过这栋楼", "湿牙刷是今天早上刚用过的", "消失的不是人，是「原来那三个人」"],
    b: "汤底：凶手杀害一家三口后，让同伙顶替他们继续在这套房子里生活，照常洗漱做饭，维持这家人还在的假象。直到邻居察觉那家人的长相和声音全变了才报警——消失的是原来的三个人，住着的早已是另外三个人。" },

  { t: "点歌的女人", d: "★",
    s: "汤面：丈夫失踪第七天，她给电台打电话点歌，主播随口多问了一句，全城听众都听出了破绽。",
    h: ["歌是点给丈夫的", "警方从未公布过案件结论", "她用错了一个词"],
    b: "汤底：主播问她点给谁，她说点给「死去的丈夫」。当时丈夫只被登记为失踪，警方从未认定他死亡，尸体也没找到。她脱口而出的「死去」，等于当众承认自己早知道丈夫已死。" },

  { t: "镜子上的名字", d: "★★",
    s: "汤面：死者中刀后挣扎着在镜面上用血写下凶手的姓氏，警方勘查后却断定：这行字是凶手自己写的。",
    h: ["字确实是蘸着血写的", "死者伤在胸口", "整面镜子干净得反常"],
    b: "汤底：胸口重伤的人满手是血，撑着镜面写字必然留下血手印和拖痕。可镜子上除了那行笔画干净的字，没有一处多余血痕——凶手是擦净手后刻意写下的，意在嫁祸给同姓的对头。" },

  { t: "电梯里的镜子", d: "★★★",
    s: "汤面：深夜她走进电梯，从轿厢的镜子里看了一眼身后的男人，立刻把每一层的按钮全按亮了。",
    h: ["镜子里照出了男人的手", "男人也从镜子里察觉她看见了", "她要的只是电梯尽快开门"],
    b: "汤底：镜面反光让她看见男人袖口露出的刀柄，而男人也从镜中知道她已经看见。她飞快按亮所有楼层，电梯每停一次就多一分被外人撞见的机会。男人撑到第三层便夺门而逃，她靠一排楼层按钮捡回一条命。" },

  { t: "每晚的牛奶", d: "★",
    s: "汤面：妻子去世一年后，丈夫被查出慢性铅中毒，毒源竟和妻子当年的死因一模一样，而他每晚只喝一杯热牛奶。",
    h: ["牛奶本身没有问题", "他每晚用的是同一只杯子", "凶手不是人"],
    b: "汤底：那套彩绘瓷杯的内壁颜料含铅，遇热析出。妻子生前每晚用它喝热牛奶，慢性中毒去世。丈夫不知内情，一年来坚持用亡妻留下的杯子，走上了同一条路。毒源相同，因为凶器从始至终是同一只杯子。" },

  { t: "三个人的晚餐", d: "★★★",
    s: "汤面：监控显示，失踪者最后与两人走进餐厅包间，离开时也是三个人，那两人均有不在场证明，失踪者却再没被找到。",
    h: ["走出餐厅的三个人里已经没有失踪者", "监控只拍到背影和衣着", "餐厅有一间不对外开放的冷库"],
    b: "汤底：包间里，凶手在用餐时杀害了失踪者，让身形相仿的同伙换上他的外套和帽子离开。监控里的「三个人」早已换了内核。真正的失踪者被藏进餐厅冷库，深夜混在冻品货车里运走。" },

  { t: "不撑伞的接头人", d: "★★",
    s: "汤面：暴雨夜，一名男子浑身湿透死在巷口，手里攥着一把完好的折叠伞，伞根本没有打开过。",
    h: ["伞没有坏", "他不撑伞是和人约好的", "这个约定本身就是个陷阱"],
    b: "汤底：男子替人送一份证据，与对方约定：雨再大也不撑伞，作为雨夜里辨认彼此的暗号。对方正是要灭口的人，靠「唯一不撑伞的人」在漆黑雨幕中轻松锁定了他。" },

  { t: "监控里的裙子", d: "★",
    s: "汤面：她调小区监控找走失的猫，却在三个月前的录像里看见一个女人，穿的那条裙子她昨天才买。",
    h: ["录像的日期没有错", "那条裙子是限量款，全城没几条", "买裙子的人她认识"],
    b: "汤底：三个月前，丈夫就把同款裙子送给了另一个女人，昨天又买了一条送给她。她以为独一无二的纪念日礼物，不过是丈夫的批量浪漫。猫找回来了，婚姻也看清了。" },

  { t: "失而复得的钥匙", d: "★",
    s: "汤面：他出差回来说钥匙丢了，报警备案并换了锁。三天后警察在门口地毯下找到那把「丢失」的钥匙，当场逮捕了他。",
    h: ["钥匙从来没有丢过", "换锁是为了制造一个「闯入者」", "屋里少的那个人再也回不来了"],
    b: "汤底：他出差前杀害了同居女友，故意报失钥匙、换新锁，准备日后伪造成拾钥入室行凶。可钥匙在地毯下被找到——他口口声声说丢在外地，钥匙却好好躺在自家门口。谎言当场崩塌，警方随即在屋内发现了尸体。" },

  { t: "上发条的闹钟", d: "★★",
    s: "汤面：独居老人的闹钟每天六点准时响，邻居嫌吵报警，警方破门后发现老人已去世多日——可闹钟今早还在响。",
    h: ["那是老式发条闹钟，不上发条走不过两天", "有人每天都在照顾这只闹钟", "闹钟响，是为了让人觉得屋里的人还活着"],
    b: "汤底：老人的侄子为拖延死讯、转移存款，每天清晨翻窗进屋给闹钟上发条并对准六点。邻居每天听见铃声，都以为老人健在。一台闹钟替死人「活」了五天，直到一纸噪音投诉戳穿了一切。" },

  { t: "没寄出的举报信", d: "★",
    s: "汤面：死者桌上放着一封写给警方的举报信，邮票贴好却没寄出，落款日期是他死后的第二天。",
    h: ["信不是死者写的", "写信的人巴不得警察看到它", "日期是伪造时最容易被忽略的破绽"],
    b: "汤底：凶手杀人后伪造了这封举报信，想把案子引向信中举报的对头。可他忘了最基本的常识：死人不能写信。落款日期比死亡时间晚了一天，伪造者反倒把自己送进了警方视线。" },

  { t: "深夜装修声", d: "★★",
    s: "汤面：楼下连续一个月深夜响起电钻声，邻居忍无可忍报警投诉噪音，警方到场后立刻封锁了整层楼。",
    h: ["那户人家根本没有在装修", "电钻声每晚固定响两个小时", "屋里一件家具都没有"],
    b: "汤底：凶手租下空屋，每晚用「装修」的电钻声掩盖毁尸灭迹的动静，花一个月分批处理完受害者。警方进门只见满屋工具与药剂，没有一块瓷砖一根木料——装修从来都是掩护。" },

  { t: "合影里的熟人", d: "★★★",
    s: "汤面：家宴合影洗出来，全家吓得说不出话：照片最后一排站着的人，三天前刚刚火化。",
    h: ["照片和相机都没有问题", "火化确有其事", "合影里那个人只是长着同一张脸"],
    b: "汤底：死者有个幼时失散的双胞胎兄弟，凭着遗物里的旧地址寻亲而来，赶到时宴席已散，只在门口被随手拍进了合影。家属从不知死者有双胞胎，才会把寻亲者当成亡者归来。" },

  { t: "散步回来的狗", d: "★",
    s: "汤面：女人说丈夫深夜出门遛狗后再没回来，狗第二天独自回了家。警察看了一眼狗，立刻申请了搜查令。",
    h: ["狗没有受伤，情绪也正常", "反常的是狗的身体状态", "整晚都在下暴雨"],
    b: "汤底：暴雨下了一整夜，独自在外游荡的狗却浑身干爽、爪缝干净——它根本没出过门，而是一直被关在屋里。女人编造了「出门遛狗失踪」的故事：丈夫早在「出门」之前，就已经死在了家里。" },

  { t: "唯一的目击者", d: "★★★",
    s: "汤面：凶案唯一的目击者是位先天失明的老人，他清楚说出凶手逃离的方向和交通工具，警方听完后反而扣下了他。",
    h: ["他确实是盲人，没有偷看", "他说对了很多细节，只有一条不对", "案发时下着暴雨"],
    b: "汤底：老人说「听见摩托车往东去了」。可案发时暴雨如注，还有卡车碾过积水，常人连说话声都听不清，他却听得过于分明——那些细节是凶手提前教他的台词。他根本不在现场，只是被雇来带偏调查方向。" },

  { t: "每月换锁的女人", d: "★★★",
    s: "汤面：她连续三个月每月叫人来换一次门锁，锁匠第四次上门时，悄悄报了警。",
    h: ["她没有丢过钥匙", "每次换锁都发生在同一件事之后", "她防的不是门外的人"],
    b: "汤底：每次换锁，都发生在她「丈夫」回家住过一晚之后。锁匠发现旧锁芯里有新鲜配钥的划痕——有人趁她熟睡偷配了钥匙。警方深入调查：她真正的丈夫一年前失踪，如今定期回来的那个是相貌酷似的冒名者，她不敢揭穿，只能用一次次换锁自保。" },

  { t: "凌晨两点半的外卖", d: "★",
    s: "汤面：独居男子死亡时间约为凌晨两点，茶几上却摆着一份两点半才送达、订单显示已签收的外卖。",
    h: ["外卖确实送到了门口", "夜宵是死者生前预约的", "签收的是屋里「还活着」的人"],
    b: "汤底：凶手两点行凶后留在现场，两点半替死者开门签了那份预约夜宵，故意让外卖员「见过活着的屋主」，把表面死亡时间推到两点半之后。而那段时间他早已回到聚会上，拿到了完美的不在场证明。" },

  { t: "不存在的七楼", d: "★★★",
    s: "汤面：大厦电梯里7楼的按钮永远按不亮，物业坚称七楼从未启用，夜班保安却多次在深夜听到井道里传来敲击声。",
    h: ["七楼真实存在", "按钮是被人为断开线路的", "敲击声是在求救"],
    b: "汤底：房东把七楼隔成暗室，电梯七楼的线路被物理断开，里面关着被骗来抵债的人。只有深夜看守离开时，他才敢敲击井道求救。所谓「不存在的楼层」里，关着一个大活人。" },

  { t: "两杯咖啡", d: "★",
    s: "汤面：妻子用同一壶咖啡倒了两杯，丈夫喝完中毒身亡，妻子那杯化验无毒，警方还是逮捕了她。",
    h: ["毒不在咖啡里", "两人喝的确实是同一壶", "唯一的区别在杯子"],
    b: "汤底：毒涂在了丈夫那只专属杯子的杯沿内侧。妻子算准他必定用惯用的杯子，同一壶咖啡倒出来，只有一杯致命。她的杯子干干净净，恰恰说明她提前知道该用哪一只。" },

  { t: "不回头的人", d: "★★",
    s: "汤面：村里人都知道老张走夜路从不回头。那晚他背后传来儿子的呼救，他没有回头，第二天就疯了。",
    h: ["他耳不聋，听得清清楚楚", "不回头是他守了十年的规矩", "那晚呼救的真是他儿子"],
    b: "汤底：老张十年前算命被警告「夜行回头必有血光」，从此绝不回头。仇家摸透了这个规矩，那晚在暗巷对他儿子下手。儿子在背后呼救，他恪守规矩没有转身，走出巷口才发现身后早已没了声音。" },

  { t: "候诊室的哭声", d: "★",
    s: "汤面：医院一间废弃诊室深夜总传出婴儿哭声，门锁着，打开门里面空无一人，保安循着哭声报了警。",
    h: ["哭声是活生生的婴儿发出的", "声音来自墙壁里面", "哭声只在固定时间出现"],
    b: "汤底：人贩子把拐来的婴儿藏在诊室天花板的夹层里，每晚定时从隔壁送奶，哭声顺着老旧管道传出来。警方拆开夹墙救出孩子，又按送奶的时间蹲守，当场抓获了人贩子。" },

  { t: "不拆的快递", d: "★★",
    s: "汤面：独居女人遇害，门口堆着十几件未拆的快递，警方据此断定：凶手是她最熟悉的人。",
    h: ["快递都是最近一个月陆续送到的", "她生前是出了名的网购狂", "不拆快递，说明「她」根本不需要拆"],
    b: "汤底：她一个月前就已遇害。凶手持续用她的手机下单，让快递不断堆在门口，伪造她还活着的假象。但所有邻居都知道她拆快递从不过夜。凶手模仿了她的一切习惯，唯独漏掉了她对拆快递的执念。" },

  { t: "挪动的身影", d: "★★★",
    s: "汤面：博物馆失窃当晚监控完好，画面里没有任何人靠近展柜，文物却凭空消失了。技术员把录像调了个速度，小偷现形了。",
    h: ["录像完整，一秒没剪", "小偷确实出现在了画面里", "他骗过的不是摄像头，是人的眼睛"],
    b: "汤底：小偷以每小时几厘米的速度向展柜挪动，常速播放时如同静止的背景一角。他用一整夜挪进展柜取走文物再挪出去。警方把录像加速百倍播放，一个缓慢移动的人影立刻现形。" },

  { t: "空着的车位", d: "★",
    s: "汤面：命案发生后，嫌疑人把车停进小区里一个常年空着的车位，警方看到监控这一幕，立刻把排查范围缩到了个位数。",
    h: ["车位不属于他", "全小区只有这一个车位常年空着", "知道这个车位安全的，都是「自己人」"],
    b: "汤底：那个车位的主人出国两年，只有同楼层的几户人家才知道它永远空着、停了也不会有人找麻烦。嫌疑人深夜熟门熟路停进这个「安全位」，恰恰暴露了他对这栋楼了如指掌——警方直接锁定了死者同层的邻居。" },

  { t: "提前熄灭的灯", d: "★★",
    s: "汤面：退休老人每晚都看见对面楼的女孩十一点准时熄灯，今晚灯十点五十就灭了，他立刻报警，救下一条人命。",
    h: ["老人和女孩素不相识", "女孩熄灯的时间十年没变过", "灯是被屋里另一个人关掉的"],
    b: "汤底：女孩独居十年，每晚十一点熄灯，分秒不差。歹徒潜入后想掩人耳目，提前关了灯。对楼老人十年记下的习惯，识破了这十分钟的异常，警方破门时歹徒还没来得及动手。" },

  { t: "锁着的阳台", d: "★★★",
    s: "汤面：死者从阳台坠楼，阳台门的插销却从内侧插着，屋内没有第二个人，警方仍断定是他杀。",
    h: ["插销是老式上下滑动的款式", "凶手是离开之后才把门「插」上的", "门底的缝隙里留着一样不起眼的东西"],
    b: "汤底：凶手把人推下阳台后退出房门，用细绳套住插销，从门底缝隙拉动绳子把插销送到位，再抽走绳子，阳台密室就此完成。警方在插销表面发现绳索勒过的纤维和压痕——从内侧「锁」上的门，恰恰证明凶手曾在门外。" },

  { t: "寄给自己的包裹", d: "★",
    s: "汤面：女人收到一个包裹，寄件人写的是她自己的名字。她没有网购，拆开一看，立刻报了警。",
    h: ["包裹不是恶作剧", "里面的东西确实属于她", "那件东西本该留在另一个城市"],
    b: "汤底：包裹里是她上周住外地酒店时「丢失」的耳环，外加一张写有房号的字条。有人从她退房后的房间里拿走耳环并寄回她家——对方既知道她的房号，也知道她的住址。警方循着包裹，抓获了长期尾随她的酒店员工。" },

  { t: "走廊尽头的房间", d: "★",
    s: "汤面：酒店走廊尽头那间房，深夜常传出女人说话的声音，可前台查过，那间房登记维修，一个月没有客人入住。",
    h: ["房里确实住着人", "她没有登记过任何信息", "住进去并非她的本意"],
    b: "汤底：酒店一名员工与外人勾结，把被拐骗的女孩藏在「维修中」的客房里等待转运。深夜的说话声是精神恍惚的女孩在自言自语。警方搜查时，人还没来得及被转走。" },

  { t: "多出的钥匙", d: "★★",
    s: "汤面：她下班回家掏钥匙开门，发现钥匙串上多了一把从未见过的钥匙，她当晚就搬去酒店并报了警。",
    h: ["钥匙不是她的，也不是房东的", "能碰到她钥匙串的人屈指可数", "那把钥匙能打开一扇正对着她的门"],
    b: "汤底：能在她毫无察觉时接触钥匙串的，只有同居男友。警方用那把钥匙打开了对面楼的出租屋——屋里贴满她的照片，窗台正对她的窗户。男友每天说完晚安，就走到对面继续「陪」她。那把钥匙，是他某晚挂错后忘了取下的。" },

  { t: "从未出生的弟弟", d: "★★★",
    s: "汤面：被拐十年的少女找回家，开口就问弟弟在哪。全家脸色大变：档案、照片、所有人的记忆里，弟弟从未存在过。",
    h: ["少女没有说谎，也没有疯", "弟弟真实存在过", "全家人用十年统一了口径"],
    b: "汤底：弟弟在她被拐后不久意外夭折，悲痛欲绝的父母烧掉照片、清空他的房间、与亲友约定绝口不提，假装这个孩子从未出生，把全部念想押在失踪的女儿身上。正是少女口中那个「不存在的弟弟」，让警方确认她就是这家失踪十年的女儿。" },

  { t: "撕到今天的日历", d: "★",
    s: "汤面：法医判断老人已死亡三天，家人却坚称不可能：老人床头的日历，今早那一页才刚刚撕掉。",
    h: ["日历确实每天都被撕掉一页", "撕日历是老人雷打不动的晨间习惯", "这三天，有人替他「活着」"],
    b: "汤底：儿子失手害死父亲后，每天清晨溜进屋子撕掉一页日历，制造父亲今晨仍在的假象，打算等自己出差归来再「第一个发现尸体」。三天三页分毫不差的节奏，反而成了他每天进出凶宅的自白。" },

  { t: "最后通话", d: "★★",
    s: "汤面：死者手机最后一通电话打给了查号台，时长只有十几秒，警方顺着这条记录破了案。",
    h: ["他不是真的要查号码", "通话内容是一个地址", "这个地址是他和妻子的暗号"],
    b: "汤底：死者被控制时佯装配合，用免提拨打查号台，报出「请查一下某某街某某号的电话」——那是他和妻子约定的求救暗号，地址就是他被关押的位置。妻子深知他从不使用查号台，立刻明白他在报位置，警方按地址找到了现场。" },

  { t: "两份遗嘱", d: "★★★",
    s: "汤面：富豪留下两份内容相反、日期相隔一天的遗嘱，鉴定均为亲笔。律师宣读完第二份，当场指向其中一人：报警。",
    h: ["两份遗嘱的字迹都是真的", "第二份是亲笔，但不是自愿的", "死者在字里留了暗号"],
    b: "汤底：继承人软禁老人，逼他重立遗嘱。老人表面顺从，却故意把人名的偏旁写成只有老律师知道的旧式错体——那是他年轻时立遗嘱用过的防伪习惯。律师认出暗号，明白老人正身处胁迫，当场发难。" },

  { t: "开足的冷气", d: "★★",
    s: "汤面：法医根据尸僵推断死亡时间为凌晨三点，嫌疑人那段时间的不在场证明铁证如山。刑警进屋看了一眼空调，推翻了结论。",
    h: ["死亡时间的推断有个前提：环境温度正常", "盛夏的屋里冷得像冰窖", "空调遥控器里装着崭新的电池"],
    b: "汤底：凶手作案后把空调开到最大制冷，低温拖慢了尸体变化，让法医把死亡时间判晚了两三个小时——正好落进嫌疑人有不在场证明的时段。遥控器里刚换的新电池说明有人临时动过空调，而屋主从不在半夜换电池。" },

  { t: "参加自己葬礼的人", d: "★★★",
    s: "汤面：男人参加完一场葬礼，回家烧掉了自己所有证件，几天后警方上门时，他已在邻市开始了新人生。",
    h: ["葬礼上火化的人他认识", "讣告上印的名字是他", "烧证件是为了让「他」彻底死透"],
    b: "汤底：火化的是他相貌酷似的孪生哥哥。他趁机调包身份，让讣告印上自己的名字，借哥哥的死「合法死亡」，甩掉巨额债务和追债的人。出席自己的葬礼，是为了确认所有人都相信他已经死了。" },

  { t: "轮到你了", d: "★★",
    s: "汤面：女人失踪前给五位旧同事群发了同一条消息：「轮到你了」。半年后，这五个人陆续辞职搬离，不知所踪。",
    h: ["「轮」指的是一种轮班", "五个人轮流在做同一件事", "她发现了那张不存在的轮值表"],
    b: "汤底：五人多年轮流在账目上动手脚侵吞货款，每人得手后换下一人。女人无意中发现账目问题出现的周期，群发「轮到你了」暗示自己已掌握名单。她被其中一人灭口，其余四人心虚逃亡——每个人都读得懂那句话，恰恰说明每个人都有份。" },

  { t: "干净的药瓶", d: "★",
    s: "汤面：老人床头放着一瓶吃空的安眠药，家属认定自杀，警察拿起瓶子看了看内壁，断定是他杀。",
    h: ["瓶子空了，像是吃了很久", "常年吃这种药的人，瓶子不会是这样", "问题出在瓶子的内壁"],
    b: "汤底：长期服用安眠药的人，瓶底瓶壁必然积着一层白色药粉。这只瓶子内壁干净如新——凶手灌药后清洗了瓶子再摆上床头。伪造自杀的人不知道，真正的药瓶从来不会这么干净。" },

  { t: "窗台的鸽子", d: "★★",
    s: "汤面：居民报警：对面窗台每晚八点准时落下一只鸽子，咕咕几声后，对面那家的灯总会闪三下。警方蹲守一周，破获大案。",
    h: ["鸽子是训练过的信鸽", "灯闪三下是「收到」的暗号", "他们在刻意避开网络"],
    b: "汤底：对面是诈骗团伙的联络点，上线每晚用信鸽投递指令，灯闪三下代表收到。为躲避网络侦查，他们退回去用鸽子传信。警方跟着鸽子返程的路线，端掉了藏在外地的上线窝点。" },

  { t: "失聪的调律师", d: "★★★",
    s: "汤面：先天失聪的调律师报警说「听见」邻居家深夜有异常响动，警方没当回事。第二天邻居遇害，调律师却矢口否认报过警。",
    h: ["他真的听不见任何声音", "他靠身体「听」", "他否认，是因为凶手也知道他「听」得到"],
    b: "汤底：调律师靠掌心贴墙、赤脚踩地感受震动来工作。那晚他感到隔壁地板传来挣扎拖拽的异常震动，便报了警。天亮得知邻居遇害，他意识到凶手可能也知道楼里有个「用身体听声音」的人，为求自保才改口否认。" },

  { t: "辞职的保安队长", d: "★★",
    s: "汤面：商场珠宝失窃当晚，干了十年的保安队长突然辞职，警方核查后第一个排除了他的嫌疑——真凶正是他。",
    h: ["失窃时段他确实在监控里巡逻", "辞职是整个计划的第二步", "珠宝根本没有离开过商场"],
    b: "汤底：他在巡逻盲区把珠宝藏进消防管道井，监控里的「清白巡逻」是演给回放看的。辞职不是逃离，而是为了几个月后以「熟悉商场的老员工」身份回来应聘保洁，名正言顺取走赃物。警方在管道井守株待兔，等到了回来取货的他。" },

  { t: "永远满格的电量", d: "★★★",
    s: "汤面：登山者失联五天，他的手机定位一直沿着原定路线移动，救援队却断定他已经遇害。",
    h: ["定位在动，不等于人在动", "他的手机有个雷打不动的习惯", "电量曲线出卖了一切"],
    b: "汤底：他有严重的电量焦虑，手机从不满电过夜，每天下午四点必充一次电。而这部手机五天来昼夜满格、持续移动——它被插在凶手车上的充电器上，跟着凶手走完了「原定路线」。救援队沿定位反查车辆，找到了嫌疑人。" },

  { t: "雪地里的一行脚印", d: "★★★",
    s: "汤面：雪地中央躺着死者，四周只有一行从尸体延伸到林边的脚印，没有第二行，警方却断定死者是被谋杀的。",
    h: ["只有「离开」的脚印，没有「过来」的脚印", "死者不是自己走到雪地中央的", "那行脚印比正常人的深得多"],
    b: "汤底：凶手背着死者走进雪地中央放下尸体，再踩着自己来时的脚印原路退回，来回脚印完全重叠，看上去只剩一行。但负重往返的踩踏让脚印深得反常，步幅又小又碎——那是一个成年人背着另一个成年人的重量走出来的。" },

  { t: "婚礼请柬", d: "★",
    s: "汤面：她收到一张婚礼请柬，新郎的名字从未听过，她看了一眼落款，连夜搬了家。",
    h: ["请柬不是寄错的", "新郎的名字是个假名", "那个名字只有她一个人能看懂"],
    b: "汤底：请柬新郎栏写的，是她十年前出庭作证送进监狱的前男友当年的绰号。婚礼是假，传话是真：我出来了，我知道你现在住哪。她当天退租搬家并报了警。" },

  { t: "温着的饭盒", d: "★★",
    s: "汤面：工地命案，工头的不在场证明是「中午还和死者一起吃了热饭」，法医一句话就戳穿了。",
    h: ["中午确实有一份热饭", "热饭证明不了吃饭的时间", "死者的胃比人证诚实"],
    b: "汤底：尸检显示死者胃内空空，死亡时间在早饭之前——他根本没活到中午。工头所谓共进午餐纯属编造，那份「死者的午饭」是他中午自己吃掉的。饭盒还温着，因为那是他自己的午饭刚吃完。" },

  { t: "三个闹钟", d: "★★★",
    s: "汤面：死者床头摆着6:00、6:05、6:10三个闹钟，凶手行凶后不取分文，只把三个闹钟全部按停，这个举动让警方锁定了他。",
    h: ["闹钟不值钱，按停它不是为财", "三个闹钟是死者的「救命铃」", "知道这个约定的，不超过两个人"],
    b: "汤底：死者患重病，三个连环闹钟是吃药提醒，并约定若铃响不停无人关，社区医生就立刻上门。凶手按停闹钟，想把「无人应门」伪装成睡过头，拖延尸体被发现。而知道闹钟与医生上门之约的，只有刚被死者从遗嘱中划掉的那个人。" },

  { t: "接通的电话", d: "★★★",
    s: "汤面：老伴去世三年，手机随葬。老太太每天下午三点拨一次那个号码，永远是停机提示。今天，电话接通了，那头传来老伴的声音：「该吃药了。」",
    h: ["那句话是提前录好的", "播放录音需要有人维护号码和设备", "三年来每天下午三点，都有人在替她守着这个约定"],
    b: "汤底：号码从未注销。儿子三年里一直给号码充值，设置成每天下午三点自动播放父亲生前的录音，只为让患病的母亲按时吃药、觉得父亲还在某处催她。今天设备故障，定时语音变成了实时接通。老太太听完只说了一句：其实我第一天就知道是你。" },

  { t: "钟楼自拍", d: "★★★",
    s: "汤面：嫌疑人出示案发时在外地景区的自拍，照片背景的钟楼正好指向案发时间，看似铁证，警方看完却当场逮捕了他。",
    h: ["照片没修过，人也确实在钟楼前", "他算准了角度和时间", "他没算到钟楼那天的安排"],
    b: "汤底：案发当天，景区钟楼例行检修，指针被固定在十二点一整天。照片里指向三点的钟楼，只可能是他上周踩点时提前拍好的存货。不在场证明做得越精确，越证明他提前策划了一切。" },

  { t: "字幕放完才走", d: "★",
    s: "每场电影散场,他都一个人坐到最后,盯着滚动的字幕看完才离开。",
    h: ["他看的电影类型很杂","他在等字幕里的某个名字","那个名字和他的家人有关"],
    b: "他的儿子是字幕翻译,署名总在最后一行。儿子在外地工作很少回家,他用这种方式每场都「见」儿子一面。" },
  { t: "楼道的灯", d: "★",
    s: "女孩搬来后,整栋楼的楼道灯每晚都亮到天明,电费单却只有她一个人在悄悄交。",
    h: ["灯不是为她自己留的","受益者凌晨才出现","是一位环卫工"],
    b: "楼下的环卫工奶奶每天凌晨四点出门,摸黑下楼摔过一次。女孩发现后,便每晚留着楼道灯,只为照亮老人出门的路。" },
  { t: "多出来的煎蛋", d: "★",

/* ================================================================
   10. 寻机头（玩家 vs AI）
   ================================================================ */
const PLANE_BASE = [[0,0],[1,-2],[1,-1],[1,0],[1,1],[1,2],[2,0],[3,-1],[3,0],[3,1]];
function rotatePlane(dir) {
  return PLANE_BASE.map(([dr, dc]) => {
    if (dir === 0) return [dr, dc];
    if (dir === 1) return [dc, -dr];
    if (dir === 2) return [-dr, -dc];
    return [-dc, dr];
  });
}
function planeCells(r, c, dir) { return rotatePlane(dir).map(([dr, dc]) => [r + dr, c + dc]); }
function canPlace(placed, r, c, dir) {
  const cells = planeCells(r, c, dir);
  for (const [rr, cc] of cells) {
    if (rr < 0 || cc < 0 || rr >= PLANE_BOARD || cc >= PLANE_BOARD) return false;
    if (placed.some(p => p.cells.some(([pr, pc]) => pr === rr && pc === cc))) return false;
  }
  return true;
}
function makePlane(r, c, dir) { return { head: [r, c], cells: planeCells(r, c, dir), dead: false }; }
function randomPlanes() {
  const planes = [];
  let guard = 0;
  while (planes.length < PLANE_COUNT && guard++ < 500) {
    const r = rndi(0, PLANE_BOARD - 1), c = rndi(0, PLANE_BOARD - 1), d = rndi(0, 3);
    if (canPlace(planes, r, c, d)) planes.push(makePlane(r, c, d));
  }
  return planes;
}

function planesView(root) {
  root.appendChild(backBar("✈️ 寻机头"));
  const hintEl = el("div", "hint");
  const stage = el("div", "stage");
  root.appendChild(stage);
  root.appendChild(hintEl);
  const CELL = 42, SZ = PLANE_BOARD * CELL;

  let phase = "choose";
  let myPlanes = [], aiPlanes = [];
  let myShots = new Set(), aiShots = new Set();
  let placeDir = 0, hoverCell = null;
  let turn = "player", busyAI = false;
  let net = null;   // 联机：{ room, chat, sentReady, oppPlanes, myTurn }

  function renderNetLobby() {
    stage.innerHTML = "";
    hintEl.textContent = "创建或加入房间，两人到齐后房主点开始";
    const wrap = buildLobby("寻机头对战",
      (rm) => {   // 房主点开始
        if (rm.members.length !== 2) { SFX.error(); return; }
        rm.send("begin", {});
        beginNet(rm);
      },
      (rm) => { rm.on("begin", () => beginNet(rm)); }   // 其他人收到开始
    );
    stage.appendChild(wrap);
  }
  function beginNet(rm) {
    net = { room: rm, sentReady: false, oppPlanes: null, myTurn: false };
    rm.on("ready", p => {
      net.oppPlanes = p.planes;
      if (net.sentReady && phase !== "battle") startNetBattle();
    });
    rm.on("fire", p => {
      aiShots.add(p.r + "," + p.c);
      resolveShot(myPlanes, p.r, p.c);
      drawBattle();
      if (checkAllDead(myPlanes)) {
        SFX.lose();
        showModal("😢 惜败", ["对方先找到了你的全部机头！"],
          [{ label: "再来一局", primary: true, onClick: () => { net.room.send("again", {}); netAgain(); } },
           { label: "离开房间", onClick: () => { net.room.leave(); net = null; show(menuView); } }]);
        return;
      }
      net.myTurn = true;
      statusEl.textContent = "🔥 轮到你了：点击右侧敌阵翻格";
    });
    rm.on("again", () => netAgain());
    phase = "place"; myPlanes = [];
    renderPlace();
    hintEl.textContent = "联机对战：摆好你的 " + PLANE_COUNT + " 架飞机后点完成，双方都就绪即开战";
  }
  function netAgain() {
    net.sentReady = false; net.oppPlanes = null; net.myTurn = false;
    myPlanes = []; phase = "place";
    renderPlace();
    hintEl.textContent = "新的一局：重新摆放你的飞机";
  }
  function netReady() {
    net.sentReady = true;
    net.room.send("ready", { planes: myPlanes });
    SFX.win();
    hintEl.textContent = "✅ 你已就绪，等对方摆完飞机…";
    if (net.oppPlanes && phase !== "battle") startNetBattle();
  }
  function startNetBattle() {
    aiPlanes = net.oppPlanes;
    net.myTurn = net.room.isHost;   // 房主先开炮
    startBattle();
  }

  function renderChoose() {
    stage.innerHTML = "";
    hintEl.textContent = "双方棋盘上各藏有 " + PLANE_COUNT + " 架飞机，轮流翻格，先击中对方全部机头者胜！";
    const box = el("div"); box.style.cssText = "text-align:center;margin:40px 0;width:100%";
    box.appendChild(el("div", "game-title", "选择你的布阵方式"));
    const row = el("div"); row.style.cssText = "display:flex;gap:20px;justify-content:center;margin-top:24px";
    const b1 = el("button", "btn primary big", "🛠 自己摆放飞机");
    const b2 = el("button", "btn mint big", "🤖 AI 帮我摆");
    b1.onclick = () => { SFX.click(); phase = "place"; renderPlace(); };
    b2.onclick = () => { SFX.click(); myPlanes = randomPlanes(); startBattle(); };
    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
    const netRow = el("div"); netRow.style.cssText = "margin-top:18px";
    const b3 = el("button", "btn big", "👥 和好友联机对战");
    b3.onclick = () => {
      SFX.click();
      if (!currentUser) { showModal("需要先登录", ["联机对战要有账号才能开房间哦", "点右上角「登录」注册/登录后再来～"], [{ label: "好的", primary: true }]); return; }
      renderNetLobby();

    box.appendChild(netRow);
    stage.appendChild(box);
  }

  let placeCv = null;
  function renderPlace() {
    stage.innerHTML = "";
    const box = el("div"); box.style.textAlign = "center";
    box.appendChild(el("div", "game-title", `放置飞机（${myPlanes.length}/${PLANE_COUNT}）`));
    const dirRow = el("div", "mode-row");
    [["↓ 机头朝下", 0], ["← 朝左", 1], ["↑ 朝上", 2], ["→ 朝右", 3]].forEach(([label, d]) => {
      const b = el("button", "btn" + (d === placeDir ? " sel" : ""), label);
      b.onclick = () => { SFX.click(); placeDir = d; renderPlace(); };
      dirRow.appendChild(b);
    });
    box.appendChild(dirRow);
    placeCv = makeCanvas(SZ, SZ);
    box.appendChild(placeCv);
    const btnRow = el("div", "mode-row");
    const resetB = el("button", "btn", "重新放置");
    resetB.onclick = () => { SFX.click(); myPlanes = []; renderPlace(); };
    const doneB = el("button", "btn primary", "完成放置，开战！");
    doneB.onclick = () => {
      if (myPlanes.length < PLANE_COUNT) { SFX.error(); return; }
      SFX.click();
      if (net) netReady(); else startBattle();
    };
    btnRow.appendChild(resetB); btnRow.appendChild(doneB);
    box.appendChild(btnRow);
    stage.appendChild(box);
    hintEl.textContent = "移动鼠标预览，点击棋盘放置机头 · 放满 " + PLANE_COUNT + " 架后开战";

    placeCv.addEventListener("mousemove", (e) => {
      const [px, py] = evXY(e, placeCv);
      hoverCell = [Math.floor(py / CELL), Math.floor(px / CELL)];
      drawPlace();
    });
    placeCv.addEventListener("mouseleave", () => { hoverCell = null; drawPlace(); });
    placeCv.addEventListener("mousedown", (e) => {
      const [px, py] = evXY(e, placeCv);
      const r = Math.floor(py / CELL), c = Math.floor(px / CELL);
      if (myPlanes.length >= PLANE_COUNT) { SFX.error(); return; }
      if (canPlace(myPlanes, r, c, placeDir)) {
        myPlanes.push(makePlane(r, c, placeDir)); SFX.place(); renderPlace();
      } else SFX.error();
    });
    drawPlace();
  }
  function drawPlace() {
    const ctx = placeCv.getContext("2d");
    ctx.clearRect(0, 0, SZ, SZ);
    drawGrid(ctx);
    myPlanes.forEach(p => paintPlane(ctx, p, "#8ecfff", "#ff8d9d"));
    if (hoverCell && myPlanes.length < PLANE_COUNT) {
      const ok = canPlace(myPlanes, hoverCell[0], hoverCell[1], placeDir);
      ctx.globalAlpha = 0.45;
      paintPlane(ctx, makePlane(...hoverCell, placeDir), ok ? "#7fd6a4" : "#ff8d9d", ok ? "#7fd6a4" : "#ff8d9d");
      ctx.globalAlpha = 1;
    }
  }
  function drawGrid(ctx) {
    for (let r = 0; r < PLANE_BOARD; r++) for (let c = 0; c < PLANE_BOARD; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#f4efe4" : "#faf5ea";
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
    }
  }
  function paintPlane(ctx, plane, bodyColor, headColor) {
    plane.cells.forEach(([r, c]) => {
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.roundRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4, 6); ctx.fill();
    });
    const [hr, hc] = plane.head;
    ctx.fillStyle = headColor;
    ctx.beginPath(); ctx.roundRect(hc * CELL + 2, hr * CELL + 2, CELL - 4, CELL - 4, 6); ctx.fill();
    ctx.fillStyle = "#5a4a42";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("✈", hc * CELL + CELL / 2, hr * CELL + CELL / 2 + 1);
  }

  let myCv, aiCv, statusEl, shotsEl;
  function startBattle() {
    if (!net) aiPlanes = randomPlanes();
    myShots = new Set(); aiShots = new Set();
    turn = "player"; busyAI = false; phase = "battle";
    stage.innerHTML = "";
    statusEl = el("div", "game-title", net ? (net.myTurn ? "🔥 你先手：点击右侧敌阵翻格" : "对方先手，等对方开炮…") : "你的回合：点击右侧敌阵翻格");
    stage.appendChild(statusEl);
    const boards = el("div", "stage");
    const left = el("div"); left.style.textAlign = "center";
    left.appendChild(el("div", null, "🛡 我的阵地"));
    myCv = makeCanvas(SZ, SZ); left.appendChild(myCv);
    const right = el("div"); right.style.textAlign = "center";
    right.appendChild(el("div", null, "🎯 敌方阵地（点击翻格）"));
    aiCv = makeCanvas(SZ, SZ); aiCv.style.cursor = "crosshair"; right.appendChild(aiCv);
    boards.appendChild(left); boards.appendChild(right);
    stage.appendChild(boards);
    shotsEl = el("div", "hint");
    stage.appendChild(shotsEl);
    hintEl.textContent = "灰=未中 蓝=机身 红=机头 · ESC 返回主菜单";

    aiCv.addEventListener("mousedown", (e) => {
      if (phase !== "battle") return;
      if (net) { if (!net.myTurn) return; }
      else if (turn !== "player" || busyAI) return;
      const [px, py] = evXY(e, aiCv);
      const r = Math.floor(py / CELL), c = Math.floor(px / CELL);
      if (r < 0 || c < 0 || r >= PLANE_BOARD || c >= PLANE_BOARD) return;
      const key = r + "," + c;
      if (myShots.has(key)) return;
      myShots.add(key);
      resolveShot(aiPlanes, r, c);
      drawBattle();
      if (checkAllDead(aiPlanes)) {
        SFX.win();
        if (net) {
          showModal("🏆 胜利！", ["你先击落了对方全部 " + PLANE_COUNT + " 个机头！", `共用 ${myShots.size} 次翻格`],
            [{ label: "再来一局", primary: true, onClick: () => { net.room.send("again", {}); netAgain(); } },
             { label: "离开房间", onClick: () => { net.room.leave(); net = null; show(menuView); } }]);
        } else {
          showModal("🏆 胜利！", [`你找到了全部 ${PLANE_COUNT} 个机头！`, `共用 ${myShots.size} 次翻格`],
            [{ label: "再来一局", primary: true, onClick: () => { phase = "choose"; renderChoose(); } },
             { label: "返回主菜单", onClick: () => show(menuView) }]);
        }
        return;
      }
      if (net) {
        net.myTurn = false;
        net.room.send("fire", { r, c });
        statusEl.textContent = "💥 已开炮！等对方回合…";
      } else {
        turn = "ai"; busyAI = true;
        statusEl.textContent = "AI 思考中…";
        setTimeout(aiAttack, 650);
      }
    });
    drawBattle();
  }
  function resolveShot(planes, r, c) {
    for (const p of planes) {
      if (p.head[0] === r && p.head[1] === c) { p.dead = true; SFX.boom(); setTimeout(SFX.win, 200); return; }
      if (p.cells.some(([pr, pc]) => pr === r && pc === c)) { SFX.reveal(); return; }
    }
    SFX.tick();
  }
  function checkAllDead(planes) { return planes.every(p => p.dead); }
  function aiAttack() {
    let target = null;
    const hitBodies = [];
    myPlanes.forEach(p => {
      if (p.dead) return;
      p.cells.forEach(([r, c]) => {
        if (aiShots.has(r + "," + c) && !(p.head[0] === r && p.head[1] === c)) hitBodies.push([r, c]);
      });
    });
    const cand = [];
    hitBodies.forEach(([r, c]) => {
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nc >= 0 && nr < PLANE_BOARD && nc < PLANE_BOARD && !aiShots.has(nr + "," + nc)) cand.push([nr, nc]);
      });
    });
    if (cand.length) target = cand[rndi(0, cand.length - 1)];
    else {
      const rest = [];
      for (let r = 0; r < PLANE_BOARD; r++) for (let c = 0; c < PLANE_BOARD; c++)
        if (!aiShots.has(r + "," + c)) rest.push([r, c]);
      target = rest[rndi(0, rest.length - 1)];
    }
    aiShots.add(target[0] + "," + target[1]);
    resolveShot(myPlanes, target[0], target[1]);
    drawBattle();
    if (checkAllDead(myPlanes)) {
      SFX.lose();
      showModal("😢 惜败", ["AI 先找到了你的全部机头！", `AI 用了 ${aiShots.size} 次翻格`],
        [{ label: "再来一局", primary: true, onClick: () => { phase = "choose"; renderChoose(); } },
         { label: "返回主菜单", onClick: () => show(menuView) }]);
      return;
    }
    turn = "player"; busyAI = false;
    statusEl.textContent = "你的回合：点击右侧敌阵翻格";
  }
  function drawBattle() {
    const ctxA = myCv.getContext("2d"), ctxB = aiCv.getContext("2d");
    ctxA.clearRect(0, 0, SZ, SZ); ctxB.clearRect(0, 0, SZ, SZ);
    drawGrid(ctxA); drawGrid(ctxB);
    myPlanes.forEach(p => paintPlane(ctxA, p, p.dead ? "#ff8d9d" : "#a8c8e0", "#ff8d9d"));
    aiShots.forEach(key => {
      const [r, c] = key.split(",").map(Number);
      const isPlane = myPlanes.some(p => p.cells.some(([pr, pc]) => pr === r && pc === c));
      if (!isPlane) { ctxA.fillStyle = "#c9c0b0"; ctxA.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4); }
    });
    myShots.forEach(key => {
      const [r, c] = key.split(",").map(Number);
      let isBody = false;
      for (const p of aiPlanes) {
        if (p.cells.some(([pr, pc]) => pr === r && pc === c)) { isBody = true; break; }
      }
      ctxB.fillStyle = isBody ? "#8ecfff" : "#ddd5c5";
      ctxB.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
    });
    aiPlanes.forEach(p => { if (p.dead) paintPlane(ctxB, p, "#8ecfff", "#ff8d9d"); });
    const myDead = aiPlanes.filter(p => p.dead).length;
    const aiDead = myPlanes.filter(p => p.dead).length;
    shotsEl.textContent = `已击落敌机 ${myDead}/${PLANE_COUNT}　·　我方损失 ${aiDead}/${PLANE_COUNT}　·　双方翻格 ${myShots.size} : ${aiShots.size}`;
  }
  renderChoose();
  return onEsc();
}

/* ================================================================ */
document.title = SITE_TITLE + " · 游戏时光";
show(menuView);
</script>
</body>
