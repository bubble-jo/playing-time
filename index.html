   9. 数独（20 关难度递进）
   ================================================================ */
function genSudoku(holes) {
  const g = Array.from({ length: 9 }, () => Array(9).fill(0));
  function valid(r, c, v) {
    for (let i = 0; i < 9; i++) if (g[r][i] === v || g[i][c] === v) return false;
    const br = r - r % 3, bc = c - c % 3;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) if (g[br+i][bc+j] === v) return false;
    return true;
  }
  function fill() {
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      if (g[r][c]) continue;
      const nums = [1,2,3,4,5,6,7,8,9].sort(() => Math.random() - .5);
      for (const v of nums) if (valid(r, c, v)) { g[r][c] = v; if (fill()) return true; g[r][c] = 0; }
      return false;
    }
    return true;
  }
  fill();
  const pos = [];
  for (let i = 0; i < 81; i++) pos.push(i);
  pos.sort(() => Math.random() - .5);
  for (let i = 0; i < holes; i++) g[Math.floor(pos[i] / 9)][pos[i] % 9] = 0;
  return g;
}

function sudokuView(root) {
  root.appendChild(backBar("🔢 数独"));
  const stage = el("div", "stage");
  const cv = makeCanvas(540, 540);
  stage.appendChild(cv);
  const side = el("div", "side-panel");
  const lvEl = el("div", "row"); lvEl.style.cssText = "font-weight:bold;color:var(--accent)";
  side.appendChild(lvEl);
  side.appendChild(el("h3", null, "数字键"));
  const pad = el("div", "num-pad");
  side.appendChild(pad);
  const checkBtn = el("button", "btn primary", "检查答案"); checkBtn.style.cssText = "width:100%;margin-top:14px";
  const againBtn = el("button", "btn", "重开本关"); againBtn.style.cssText = "width:100%;margin-top:8px";
  const autoBtn = el("button", "btn", "自动填充：关"); autoBtn.style.cssText = "width:100%;margin-top:8px";
  autoBtn.onclick = () => { autoFill = !autoFill; autoBtn.textContent = "自动填充：" + (autoFill ? "开" : "关"); autoBtn.className = autoFill ? "btn mint" : "btn"; SFX.click(); if (autoFill) autoFillBoard(); };
  side.appendChild(checkBtn); side.appendChild(autoBtn); side.appendChild(againBtn);
  stage.appendChild(side);
  root.appendChild(stage);
  root.appendChild(el("div", "hint", "点击格子后填入数字（键盘 1-9 也可，0/Delete 清除）· 红字为冲突 · ESC 返回"));

  const ctx = cv.getContext("2d");
  const CELL = 60;
  let grid, fixed, sel = null, lv = getLevel("sudoku", SUDOKU_LEVELS) - 1, autoFill = false;
  const holesFor = i => 32 + i;

  function autoFillBoard() {
    let changed = true, filled = false;
    while (changed) {
      changed = false;
      for (let r = 0; r < 9; r++) {
        const empties = [], seen = new Set(); let dup = false;
        for (let c = 0; c < 9; c++) { const v = grid[r][c]; if (!v) empties.push(c); else { if (seen.has(v)) dup = true; seen.add(v); } }
        if (empties.length === 1 && !dup) {
          const miss = [1,2,3,4,5,6,7,8,9].find(n => !seen.has(n));
          if (miss !== undefined) { grid[r][empties[0]] = miss; changed = true; filled = true; }
        }
      }
      for (let c = 0; c < 9; c++) {
        const empties = [], seen = new Set(); let dup = false;
        for (let r = 0; r < 9; r++) { const v = grid[r][c]; if (!v) empties.push(r); else { if (seen.has(v)) dup = true; seen.add(v); } }
        if (empties.length === 1 && !dup) {
          const miss = [1,2,3,4,5,6,7,8,9].find(n => !seen.has(n));
          if (miss !== undefined) { grid[empties[0]][c] = miss; changed = true; filled = true; }
        }
      }
    }
    if (filled) { SFX.reveal(); draw(); }
  }

  function reset() {
    const puzzle = genSudoku(holesFor(lv));
    grid = puzzle.map(r => r.slice());
    fixed = puzzle.map(r => r.map(v => v !== 0));
    sel = null;
    lvEl.textContent = `第 ${lv + 1} / ${SUDOKU_LEVELS} 关（空 ${holesFor(lv)} 格）`;
    draw();
  }
  function conflicts(r, c) {
    const v = grid[r][c];
    if (!v) return false;
    for (let i = 0; i < 9; i++) {
      if (i !== c && grid[r][i] === v) return true;
      if (i !== r && grid[i][c] === v) return true;
    }
    const br = r - r % 3, bc = c - c % 3;
    for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
      if ((br + i !== r || bc + j !== c) && grid[br+i][bc+j] === v) return true;
    return false;
  }
  function draw() {
    ctx.clearRect(0, 0, 540, 540);
    for (let r = 0; r < 9; r++) for (let c = 0; c < 9; c++) {
      ctx.fillStyle = "#fffdf7";
      if (sel && sel[0] === r && sel[1] === c) ctx.fillStyle = "#ffe8ec";
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
      const v = grid[r][c];
      if (v) {
        ctx.font = (fixed[r][c] ? "bold " : "") + "28px Microsoft YaHei";
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = fixed[r][c] ? "#5a4a42" : (conflicts(r, c) ? "#ff6b8d" : "#6aa8e8");
        ctx.fillText(v, c * CELL + CELL / 2, r * CELL + CELL / 2 + 1);
      }
    }
    ctx.strokeStyle = "#c9b8a8";
    for (let i = 0; i <= 9; i++) {
      ctx.lineWidth = i % 3 === 0 ? 3 : 1;
      ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, 540); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * CELL); ctx.lineTo(540, i * CELL); ctx.stroke();
    }
  }
  function input(v) {
    if (!sel) return;
    const [r, c] = sel;
    if (fixed[r][c]) { SFX.error(); return; }
    grid[r][c] = v; SFX.place(); draw();
    if (autoFill) setTimeout(autoFillBoard, 60);
  }
  for (let v = 1; v <= 9; v++) {
    const b = el("button", "btn", String(v));
    b.onclick = () => input(v);
    pad.appendChild(b);
  }
  const clr = el("button", "btn", "清除");
  clr.onclick = () => input(0);
  pad.appendChild(clr);
  cv.addEventListener("mousedown", (e) => {
    const rect = cv.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left) / CELL);
    const r = Math.floor((e.clientY - rect.top) / CELL);
    if (r >= 0 && c >= 0 && r < 9 && c < 9) { sel = [r, c]; SFX.click(); draw(); }
  });
  const keyH = (e) => {
    if (/^[1-9]$/.test(e.key)) input(Number(e.key));
    if (e.key === "0" || e.key === "Delete" || e.key === "Backspace") input(0);
    if (e.key === "Escape") show(menuView);
  };
  window.addEventListener("keydown", keyH);
  function boardLegal() {
    for (let r = 0; r < 9; r++) {
      const seen = {};
      for (let c = 0; c < 9; c++) { const v = grid[r][c]; if (!v || seen[v]) return false; seen[v] = 1; }
    }
    for (let c = 0; c < 9; c++) {
      const seen = {};
      for (let r = 0; r < 9; r++) { const v = grid[r][c]; if (seen[v]) return false; seen[v] = 1; }
    }
    for (let br = 0; br < 9; br += 3) for (let bc = 0; bc < 9; bc += 3) {
      const seen = {};
      for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) {
        const v = grid[br+i][bc+j]; if (seen[v]) return false; seen[v] = 1;
      }
    }
    return true;
  }
  checkBtn.onclick = () => {
    const empty = grid.some(row => row.some(v => !v));
    if (empty) { SFX.error(); showModal("还没填完", ["还有空格未填写，继续加油！"], [{ label: "继续", primary: true }]); return; }
    if (boardLegal()) {
      SFX.win();
      saveLevel("sudoku", Math.min(SUDOKU_LEVELS, lv + 2));
      checkToyUnlocks();
      const last = lv + 1 >= SUDOKU_LEVELS;
      showModal(last ? "🏆 全部通关！" : "🎉 恭喜过关！",
        [last ? `你完成了全部 ${SUDOKU_LEVELS} 关！` : `第 ${lv + 1} 关答案正确！`],
        last ? [{ label: "重新游玩", primary: true, onClick: () => { lv = 0; reset(); } },
                { label: "返回主菜单", onClick: () => show(menuView) }]
             : [{ label: "下一关", primary: true, onClick: () => { lv++; reset(); } },
                { label: "返回主菜单", onClick: () => show(menuView) }]);
    } else {
      SFX.lose();
      showModal("答案有误", ["有填错的格子（红字为冲突提示），再检查一下。"], [{ label: "继续修改", primary: true }]);
    }
  };
  againBtn.onclick = () => { SFX.click(); reset(); };
  reset();
  return () => window.removeEventListener("keydown", keyH);
}

/* ================================================================
   10. 寻机头（玩家 vs AI）
   ================================================================ */
const PLANE_BASE = [[0,0],[1,-2],[1,-1],[1,0],[1,1],[1,2],[2,0],[3,-1],[3,0],[3,1]];
function rotatePlane(dir) {
  return PLANE_BASE.map(([dr, dc]) => {
    if (dir === 0) return [dr, dc];
    if (dir === 1) return [dc, -dr];
    if (dir === 2) return [-dr, -dc];
    return [-dc, dr];
  });
}
function planeCells(r, c, dir) { return rotatePlane(dir).map(([dr, dc]) => [r + dr, c + dc]); }
function canPlace(placed, r, c, dir) {
  const cells = planeCells(r, c, dir);
  for (const [rr, cc] of cells) {
    if (rr < 0 || cc < 0 || rr >= PLANE_BOARD || cc >= PLANE_BOARD) return false;
    if (placed.some(p => p.cells.some(([pr, pc]) => pr === rr && pc === cc))) return false;
  }
  return true;
}
function makePlane(r, c, dir) { return { head: [r, c], cells: planeCells(r, c, dir), dead: false }; }
function randomPlanes() {
  const planes = [];
  let guard = 0;
  while (planes.length < PLANE_COUNT && guard++ < 500) {
    const r = rndi(0, PLANE_BOARD - 1), c = rndi(0, PLANE_BOARD - 1), d = rndi(0, 3);
    if (canPlace(planes, r, c, d)) planes.push(makePlane(r, c, d));
  }
  return planes;
}

function planesView(root) {
  root.appendChild(backBar("✈️ 寻机头"));
  const hintEl = el("div", "hint");
  const stage = el("div", "stage");
  root.appendChild(stage);
  root.appendChild(hintEl);
  const CELL = 42, SZ = PLANE_BOARD * CELL;

  let phase = "choose";
  let myPlanes = [], aiPlanes = [];
  let myShots = new Set(), aiShots = new Set();
  let placeDir = 0, hoverCell = null;
  let turn = "player", busyAI = false;

  function renderChoose() {
    stage.innerHTML = "";
    hintEl.textContent = "双方棋盘上各藏有 " + PLANE_COUNT + " 架飞机，轮流翻格，先击中对方全部机头者胜！";
    const box = el("div"); box.style.cssText = "text-align:center;margin:40px 0;width:100%";
    box.appendChild(el("div", "game-title", "选择你的布阵方式"));
    const row = el("div"); row.style.cssText = "display:flex;gap:20px;justify-content:center;margin-top:24px";
    const b1 = el("button", "btn primary big", "🛠 自己摆放飞机");
    const b2 = el("button", "btn mint big", "🤖 AI 帮我摆");
    b1.onclick = () => { SFX.click(); phase = "place"; renderPlace(); };
    b2.onclick = () => { SFX.click(); myPlanes = randomPlanes(); startBattle(); };
    row.appendChild(b1); row.appendChild(b2);
    box.appendChild(row);
    stage.appendChild(box);
  }

  let placeCv = null;
  function renderPlace() {
    stage.innerHTML = "";
    const box = el("div"); box.style.textAlign = "center";
    box.appendChild(el("div", "game-title", `放置飞机（${myPlanes.length}/${PLANE_COUNT}）`));
    const dirRow = el("div", "mode-row");
    [["↓ 机头朝下", 0], ["← 朝左", 1], ["↑ 朝上", 2], ["→ 朝右", 3]].forEach(([label, d]) => {
      const b = el("button", "btn" + (d === placeDir ? " sel" : ""), label);
      b.onclick = () => { SFX.click(); placeDir = d; renderPlace(); };
      dirRow.appendChild(b);
    });
    box.appendChild(dirRow);
    placeCv = makeCanvas(SZ, SZ);
    box.appendChild(placeCv);
    const btnRow = el("div", "mode-row");
    const resetB = el("button", "btn", "重新放置");
    resetB.onclick = () => { SFX.click(); myPlanes = []; renderPlace(); };
    const doneB = el("button", "btn primary", "完成放置，开战！");
    doneB.onclick = () => {
      if (myPlanes.length < PLANE_COUNT) { SFX.error(); return; }
      SFX.click(); startBattle();
    };
    btnRow.appendChild(resetB); btnRow.appendChild(doneB);
    box.appendChild(btnRow);
    stage.appendChild(box);
    hintEl.textContent = "移动鼠标预览，点击棋盘放置机头 · 放满 " + PLANE_COUNT + " 架后开战";

    placeCv.addEventListener("mousemove", (e) => {
      const rect = placeCv.getBoundingClientRect();
      hoverCell = [Math.floor((e.clientY - rect.top) / CELL), Math.floor((e.clientX - rect.left) / CELL)];
      drawPlace();
    });
    placeCv.addEventListener("mouseleave", () => { hoverCell = null; drawPlace(); });
    placeCv.addEventListener("mousedown", (e) => {
      const rect = placeCv.getBoundingClientRect();
      const r = Math.floor((e.clientY - rect.top) / CELL), c = Math.floor((e.clientX - rect.left) / CELL);
      if (myPlanes.length >= PLANE_COUNT) { SFX.error(); return; }
      if (canPlace(myPlanes, r, c, placeDir)) {
        myPlanes.push(makePlane(r, c, placeDir)); SFX.place(); renderPlace();
      } else SFX.error();
    });
    drawPlace();
  }
  function drawPlace() {
    const ctx = placeCv.getContext("2d");
    ctx.clearRect(0, 0, SZ, SZ);
    drawGrid(ctx);
    myPlanes.forEach(p => paintPlane(ctx, p, "#8ecfff", "#ff8d9d"));
    if (hoverCell && myPlanes.length < PLANE_COUNT) {
      const ok = canPlace(myPlanes, hoverCell[0], hoverCell[1], placeDir);
      ctx.globalAlpha = 0.45;
      paintPlane(ctx, makePlane(...hoverCell, placeDir), ok ? "#7fd6a4" : "#ff8d9d", ok ? "#7fd6a4" : "#ff8d9d");
      ctx.globalAlpha = 1;
    }
  }
  function drawGrid(ctx) {
    for (let r = 0; r < PLANE_BOARD; r++) for (let c = 0; c < PLANE_BOARD; c++) {
      ctx.fillStyle = (r + c) % 2 ? "#f4efe4" : "#faf5ea";
      ctx.fillRect(c * CELL + 1, r * CELL + 1, CELL - 2, CELL - 2);
    }
  }
  function paintPlane(ctx, plane, bodyColor, headColor) {
    plane.cells.forEach(([r, c]) => {
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.roundRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4, 6); ctx.fill();
    });
    const [hr, hc] = plane.head;
    ctx.fillStyle = headColor;
    ctx.beginPath(); ctx.roundRect(hc * CELL + 2, hr * CELL + 2, CELL - 4, CELL - 4, 6); ctx.fill();
    ctx.fillStyle = "#5a4a42";
    ctx.font = "bold 14px sans-serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("✈", hc * CELL + CELL / 2, hr * CELL + CELL / 2 + 1);
  }

  let myCv, aiCv, statusEl, shotsEl;
  function startBattle() {
    aiPlanes = randomPlanes();
    myShots = new Set(); aiShots = new Set();
    turn = "player"; busyAI = false; phase = "battle";
    stage.innerHTML = "";
    statusEl = el("div", "game-title", "你的回合：点击右侧敌阵翻格");
    stage.appendChild(statusEl);
    const boards = el("div", "stage");
    const left = el("div"); left.style.textAlign = "center";
    left.appendChild(el("div", null, "🛡 我的阵地"));
    myCv = makeCanvas(SZ, SZ); left.appendChild(myCv);
    const right = el("div"); right.style.textAlign = "center";
    right.appendChild(el("div", null, "🎯 敌方阵地（点击翻格）"));
    aiCv = makeCanvas(SZ, SZ); aiCv.style.cursor = "crosshair"; right.appendChild(aiCv);
    boards.appendChild(left); boards.appendChild(right);
    stage.appendChild(boards);
    shotsEl = el("div", "hint");
    stage.appendChild(shotsEl);
    hintEl.textContent = "灰=未中 蓝=机身 红=机头 · ESC 返回主菜单";

    aiCv.addEventListener("mousedown", (e) => {
      if (phase !== "battle" || turn !== "player" || busyAI) return;
      const rect = aiCv.getBoundingClientRect();
      const r = Math.floor((e.clientY - rect.top) / CELL), c = Math.floor((e.clientX - rect.left) / CELL);
      if (r < 0 || c < 0 || r >= PLANE_BOARD || c >= PLANE_BOARD) return;
      const key = r + "," + c;
      if (myShots.has(key)) return;
      myShots.add(key);
      resolveShot(aiPlanes, r, c);
      drawBattle();
      if (checkAllDead(aiPlanes)) {
        SFX.win();
        showModal("🏆 胜利！", [`你找到了全部 ${PLANE_COUNT} 个机头！`, `共用 ${myShots.size} 次翻格`],
          [{ label: "再来一局", primary: true, onClick: () => { phase = "choose"; renderChoose(); } },
           { label: "返回主菜单", onClick: () => show(menuView) }]);
        return;
      }
      turn = "ai"; busyAI = true;
      statusEl.textContent = "AI 思考中…";
      setTimeout(aiAttack, 650);
    });
    drawBattle();
  }
  function resolveShot(planes, r, c) {
    for (const p of planes) {
      if (p.head[0] === r && p.head[1] === c) { p.dead = true; SFX.boom(); setTimeout(SFX.win, 200); return; }
      if (p.cells.some(([pr, pc]) => pr === r && pc === c)) { SFX.reveal(); return; }
    }
    SFX.tick();
  }
  function checkAllDead(planes) { return planes.every(p => p.dead); }
  function aiAttack() {
    let target = null;
    const hitBodies = [];
    myPlanes.forEach(p => {
      if (p.dead) return;
      p.cells.forEach(([r, c]) => {
        if (aiShots.has(r + "," + c) && !(p.head[0] === r && p.head[1] === c)) hitBodies.push([r, c]);
      });
    });
    const cand = [];
    hitBodies.forEach(([r, c]) => {
      [[0,1],[0,-1],[1,0],[-1,0]].forEach(([dr, dc]) => {
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nc >= 0 && nr < PLANE_BOARD && nc < PLANE_BOARD && !aiShots.has(nr + "," + nc)) cand.push([nr, nc]);
      });
    });
    if (cand.length) target = cand[rndi(0, cand.length - 1)];
    else {
      const rest = [];
      for (let r = 0; r < PLANE_BOARD; r++) for (let c = 0; c < PLANE_BOARD; c++)
        if (!aiShots.has(r + "," + c)) rest.push([r, c]);
      target = rest[rndi(0, rest.length - 1)];
    }
    aiShots.add(target[0] + "," + target[1]);
    resolveShot(myPlanes, target[0], target[1]);
    drawBattle();
    if (checkAllDead(myPlanes)) {
      SFX.lose();
      showModal("😢 惜败", ["AI 先找到了你的全部机头！", `AI 用了 ${aiShots.size} 次翻格`],
        [{ label: "再来一局", primary: true, onClick: () => { phase = "choose"; renderChoose(); } },
         { label: "返回主菜单", onClick: () => show(menuView) }]);
      return;
    }
    turn = "player"; busyAI = false;
    statusEl.textContent = "你的回合：点击右侧敌阵翻格";
  }
  function drawBattle() {
    const ctxA = myCv.getContext("2d"), ctxB = aiCv.getContext("2d");
    ctxA.clearRect(0, 0, SZ, SZ); ctxB.clearRect(0, 0, SZ, SZ);
    drawGrid(ctxA); drawGrid(ctxB);
    myPlanes.forEach(p => paintPlane(ctxA, p, p.dead ? "#ff8d9d" : "#a8c8e0", "#ff8d9d"));
    aiShots.forEach(key => {
      const [r, c] = key.split(",").map(Number);
      const isPlane = myPlanes.some(p => p.cells.some(([pr, pc]) => pr === r && pc === c));
      if (!isPlane) { ctxA.fillStyle = "#c9c0b0"; ctxA.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4); }
    });
    myShots.forEach(key => {
      const [r, c] = key.split(",").map(Number);
      let isBody = false;
      for (const p of aiPlanes) {
        if (p.cells.some(([pr, pc]) => pr === r && pc === c)) { isBody = true; break; }
      }
      ctxB.fillStyle = isBody ? "#8ecfff" : "#ddd5c5";
      ctxB.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
    });
    aiPlanes.forEach(p => { if (p.dead) paintPlane(ctxB, p, "#8ecfff", "#ff8d9d"); });
    const myDead = aiPlanes.filter(p => p.dead).length;
    const aiDead = myPlanes.filter(p => p.dead).length;
    shotsEl.textContent = `已击落敌机 ${myDead}/${PLANE_COUNT}　·　我方损失 ${aiDead}/${PLANE_COUNT}　·　双方翻格 ${myShots.size} : ${aiShots.size}`;
  }
  renderChoose();
  return onEsc();
}

/* ================================================================ */
document.title = SITE_TITLE + " · 游戏时光";
show(menuView);
</script>
